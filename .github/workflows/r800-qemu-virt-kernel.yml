name: SM-R800 patched source generic virt kernel (non-release)

on:
  push:
    branches:
      - development/r800-display-error-propagation-20261125
    paths:
      - .github/workflows/r800-qemu-virt-kernel.yml
      - build/r800_qemu_virt_compile.sh
      - build/r800_qemu_virt_contract.py
      - tests/test_qemu_virt_contract.py
      - src/kernel/qemu-virt-minimal.config
      - build/r800_qemu_system_init.py
      - build/r800_qemu_user_init.py
      - tests/test_qemu_system_init.py
      - tests/test_qemu_user_init.py
      - build/r800_initramfs_compile_smoke.sh
      - build/r800_initramfs_spec.py
      - build/r800_cpio_audit.py
      - build/r800_storage_isolation.py
      - build/r800_aosp_source_probe.sh
      - src/kernel/r800-wearos.patch
      - src/initramfs/init-readonly.c
      - src/initramfs/abi-probe.c
      - src/initramfs/abi-probe-pid1.c
      - src/initramfs/binder-probe.c
      - src/initramfs/binder-roundtrip.c
      - src/initramfs/shared-memory-probe.c
      - build/r800_qemu_guest_abi.py
      - build/r800_bionic_compile.sh
      - build/r800_android_dynamic_audit.py
      - src/initramfs/bionic-dynamic-probe.c
      - tests/test_android_dynamic_audit.py
      - build/r800_qemu_abi_probe.py
      - tests/test_qemu_guest_abi.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  virt-kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact triggering commit and synthetic contracts
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          sh -n build/r800_qemu_virt_compile.sh
          python3 -m unittest discover -s tests -p 'test_android_dynamic_audit.py' -v
          python3 -m unittest discover -s tests -p 'test_qemu_virt_contract.py' -v
          python3 -m unittest discover -s tests -p 'test_qemu_system_init.py' -v
          python3 -m unittest discover -s tests -p 'test_qemu_user_init.py' -v
          python3 -m unittest discover -s tests -p 'test_qemu_guest_abi.py' -v
      - name: Fetch pinned kernel and expand disposable source
        run: |
          sh build/r800_aosp_source_probe.sh "$GITHUB_WORKSPACE" "$RUNNER_TEMP/virt-source" "$RUNNER_TEMP/virt-source-evidence.json"
          git -C "$RUNNER_TEMP/virt-source" sparse-checkout disable
      - name: Compile patched source with separate virt configuration
        run: |
          docker run --rm --pull=always \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            -v "$RUNNER_TEMP/virt-source:/source" \
            -v "$RUNNER_TEMP:/scratch" \
            alpine:3.21 sh -eu -c '
              apk add --no-cache clang19=19.1.4-r0 lld=19.1.4-r0 llvm19=19.1.4-r1 \
                git make bash bc bison flex perl python3 openssl-dev \
                elfutils-dev build-base linux-headers coreutils findutils
              git config --global --add safe.directory /source
              sh /repo/build/r800_initramfs_compile_smoke.sh /repo /scratch/virt-init
              sh /repo/build/r800_qemu_virt_compile.sh /source /repo /scratch/virt-kernel /scratch/virt-init/initramfs.list
            '
      - name: Boot patched virt kernel without external initrd or disks
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-arm
          python3 build/r800_qemu_system_init.py \
            --init "$RUNNER_TEMP/virt-init/init" \
            --compile-evidence "$RUNNER_TEMP/virt-init/initramfs-evidence.json" \
            --generic-kernel "$RUNNER_TEMP/virt-kernel/arch/arm64/boot/Image" \
            --embedded-archive "$RUNNER_TEMP/virt-kernel/usr/initramfs_data.cpio" \
            --out-dir "$RUNNER_TEMP/virt-boot" \
            --report "$RUNNER_TEMP/virt-boot-evidence.json"
      - name: Compile separate static guest ABI PID1
        run: |
          sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross
          mkdir "$RUNNER_TEMP/virt-abi-init"
          mkdir -p "$RUNNER_TEMP/virt-abi-init/uapi/linux/android"
          cp "$RUNNER_TEMP/virt-source/include/uapi/linux/android/binder.h" "$RUNNER_TEMP/virt-abi-init/uapi/linux/android/binder.h"
          sha256sum "$RUNNER_TEMP/virt-abi-init/uapi/linux/android/binder.h" > "$RUNNER_TEMP/virt-abi-init/binder-uapi.sha256"
          cp "$RUNNER_TEMP/virt-source/drivers/staging/android/uapi/ashmem.h" "$RUNNER_TEMP/virt-abi-init/uapi/linux/ashmem.h"
          sha256sum "$RUNNER_TEMP/virt-abi-init/uapi/linux/ashmem.h" > "$RUNNER_TEMP/virt-abi-init/ashmem-uapi.sha256"
          aarch64-linux-gnu-gcc -std=c11 -Wall -Wextra -Werror -O2 -pthread -Dmain=abi_probe_main -c src/initramfs/abi-probe.c -o "$RUNNER_TEMP/virt-abi-init/probe.o"
          aarch64-linux-gnu-gcc -std=c11 -Wall -Wextra -Werror -O2 -static -pthread -Wl,--build-id=none -I"$RUNNER_TEMP/virt-abi-init/uapi" src/initramfs/abi-probe-pid1.c src/initramfs/binder-probe.c src/initramfs/binder-roundtrip.c src/initramfs/shared-memory-probe.c "$RUNNER_TEMP/virt-abi-init/probe.o" -o "$RUNNER_TEMP/virt-abi-init/init"
          python3 build/r800_initramfs_spec.py --init "$RUNNER_TEMP/virt-abi-init/init" --list "$RUNNER_TEMP/virt-abi-init/initramfs.list" --report "$RUNNER_TEMP/virt-abi-init/initramfs-evidence.json"
      - name: Boot identical virt kernel with diagnostic external initramfs
        run: |
          python3 build/r800_qemu_guest_abi.py \
            --init "$RUNNER_TEMP/virt-abi-init/init" \
            --compile-evidence "$RUNNER_TEMP/virt-abi-init/initramfs-evidence.json" \
            --kernel "$RUNNER_TEMP/virt-kernel/arch/arm64/boot/Image" \
            --baseline "$RUNNER_TEMP/virt-boot-evidence.json" \
            --out-dir "$RUNNER_TEMP/virt-abi-boot" \
            --report "$RUNNER_TEMP/virt-abi-evidence.json"
      - name: Install pinned NDK and compile separate Bionic diagnostic
        run: |
          sdkmanager --install "ndk;27.3.13750724"
          sh build/r800_bionic_compile.sh "$GITHUB_WORKSPACE" "$ANDROID_SDK_ROOT/ndk/27.3.13750724" "$RUNNER_TEMP/virt-abi-init/uapi" "$RUNNER_TEMP/virt-bionic-init"
      - name: Boot Bionic diagnostic on same virt kernel after glibc success
        run: |
          python3 build/r800_qemu_guest_abi.py \
            --init "$RUNNER_TEMP/virt-bionic-init/init" \
            --compile-evidence "$RUNNER_TEMP/virt-bionic-init/initramfs-evidence.json" \
            --bionic-compile-evidence "$RUNNER_TEMP/virt-bionic-init/bionic-compile-evidence.json" \
            --glibc-baseline "$RUNNER_TEMP/virt-abi-evidence.json" \
            --kernel "$RUNNER_TEMP/virt-kernel/arch/arm64/boot/Image" \
            --baseline "$RUNNER_TEMP/virt-boot-evidence.json" \
            --out-dir "$RUNNER_TEMP/virt-bionic-boot" \
            --report "$RUNNER_TEMP/virt-bionic-evidence.json"
      - name: Build and inspect dynamic Android PIE (no runtime execution)
        run: |
          mkdir "$RUNNER_TEMP/virt-dynamic"
          toolchain="$ANDROID_SDK_ROOT/ndk/27.3.13750724/toolchains/llvm/prebuilt/linux-x86_64/bin"
          "$toolchain/aarch64-linux-android30-clang" -std=c11 -Wall -Wextra -Werror -O2 -fPIE -pie -ldl src/initramfs/bionic-dynamic-probe.c -o "$RUNNER_TEMP/virt-dynamic/probe"
          LC_ALL=C python3 build/r800_android_dynamic_audit.py --probe "$RUNNER_TEMP/virt-dynamic/probe" --readelf "$toolchain/llvm-readelf" --report "$RUNNER_TEMP/virt-dynamic/evidence.json"
      - name: Record source and patch identity
        if: always()
        run: |
          printf 'commit=%s\nsource_base=50db73fc799f20a7120a8b5f653b16cc123d856f\nprofile=generic_virt\nsafe_to_flash=false\n' "$GITHUB_SHA" > "$RUNNER_TEMP/virt-identity.txt"
          sha256sum src/kernel/r800-wearos.patch src/kernel/qemu-virt-minimal.config >> "$RUNNER_TEMP/virt-identity.txt"
      - name: Upload diagnostics only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r800-patched-virt-evidence-only
          path: |
            ${{ runner.temp }}/virt-identity.txt
            ${{ runner.temp }}/virt-source-evidence.json
            ${{ runner.temp }}/virt-init/initramfs-evidence.json
            ${{ runner.temp }}/virt-kernel/virt-config-evidence.json
            ${{ runner.temp }}/virt-kernel/virt-cpio-evidence.json
            ${{ runner.temp }}/virt-boot-evidence.json
            ${{ runner.temp }}/virt-boot/generic-console.log
            ${{ runner.temp }}/virt-abi-init/initramfs-evidence.json
            ${{ runner.temp }}/virt-abi-init/binder-uapi.sha256
            ${{ runner.temp }}/virt-abi-init/ashmem-uapi.sha256
            ${{ runner.temp }}/virt-abi-evidence.json
            ${{ runner.temp }}/virt-abi-boot/generic-console.log
            ${{ runner.temp }}/virt-bionic-init/initramfs-evidence.json
            ${{ runner.temp }}/virt-bionic-init/bionic-compile-evidence.json
            ${{ runner.temp }}/virt-bionic-init/clang-version.txt
            ${{ runner.temp }}/virt-bionic-evidence.json
            ${{ runner.temp }}/virt-bionic-boot/generic-console.log
            ${{ runner.temp }}/virt-dynamic/evidence.json
          if-no-files-found: warn
          retention-days: 7
