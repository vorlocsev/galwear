name: SM-R800 Android runtime extraction contract (non-release)

on:
  push:
    branches:
      - development/r800-display-error-propagation-20261125
    paths:
      - .github/workflows/r800-android-runtime-extract.yml
      - build/r800_android_runtime_extract.py
      - build/r800_android_gsi_import.py
      - build/r800_aosp_runtime_build.sh
      - build/r800_aosp_property_info.sh
      - build/r800_aosp_init_service_build.sh
      - build/r800_android_init_inventory.py
      - build/r800_android_init_dependencies.py
      - tests/test_android_init_dependencies.py
      - src/android/property-service-harness.cpp
      - src/android/property-service-client.c
      - tests/test_android_init_inventory.py
      - src/android/property-info-generator.cpp
      - src/initramfs/bionic-property-area.c
      - build/r800_qemu_property_area.py
      - tests/test_qemu_property_area.py
      - tests/test_aosp_runtime_build.py
      - tests/test_android_gsi_import.py
      - build/r800_android_dynamic_audit.py
      - tests/test_android_runtime_extract.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-runtime-extraction:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install filesystem inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends e2fsprogs android-sdk-libsparse-utils
      - name: Verify exact commit and execute synthetic tests
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          bash -n build/r800_aosp_property_info.sh
          bash -n build/r800_aosp_init_service_build.sh
          python3 -m unittest discover -s tests -p 'test_android_init_inventory.py' -v
          python3 -m unittest discover -s tests -p 'test_android_init_dependencies.py' -v
          python3 -m unittest discover -s tests -p 'test_qemu_property_area.py' -v
          command -v debugfs
          command -v mke2fs
          command -v simg2img
          python3 -m py_compile build/r800_android_runtime_extract.py build/r800_android_gsi_import.py
          python3 -m unittest discover -s tests -p 'test_android_runtime_extract.py' -v
          python3 -m unittest discover -s tests -p 'test_android_gsi_import.py' -v
          python3 -m unittest discover -s tests -p 'test_aosp_runtime_build.py' -v
