name: SM-R800 Android runtime extraction contract (non-release)

on:
  push:
    branches:
      - development/r800-display-error-propagation-20261125
    paths:
      - .github/workflows/r800-android-runtime-extract.yml
      - build/r800_android_runtime_extract.py
      - build/r800_android_gsi_import.py
      - build/r800_aosp_runtime_build.sh
      - build/r800_aosp_property_info.sh
      - build/r800_aosp_init_service_build.sh
      - build/r800_android_init_inventory.py
      - build/r800_android_init_dependencies.py
      - build/r800_android_init_rootfs.py
      - build/r800_android_rootfs_preflight.py
      - build/r800_android_sepolicy_audit.py
      - build/r800_aosp_galwear_policy_build.sh
      - build/r800_galwear_policy_fixture.py
      - src/android/sepolicy/**
      - tests/test_galwear_policy_fixture.py
      - build/r800_android_file_contexts.py
      - build/r800_aosp_selinux_transition_build.sh
      - build/r800_qemu_selinux_transition.py
      - build/r800_qemu_rootfs_relabel.py
      - build/r800_qemu_property_service.py
      - build/r800_property_pipeline.py
      - build/r800_rootfs_relabel_policy_gate.py
      - build/r800_android_system_ext4.py
      - build/r800_qemu_readonly_disks.py
      - build/r800_qemu_block_smoke.py
      - tests/test_qemu_block_smoke.py
      - build/r800_qemu_prelabeled_mounts.py
      - build/r800_qemu_ext4_init_transition.py
      - build/r800_qemu_ext4_property_service.py
      - build/r800_ext4_property_pipeline.py
      - build/r800_ext4_nosuid_policy_gate.py
      - build/r800_ext4_exec_access_audit.py
      - build/r800_ext4_console_contract.py
      - tests/test_ext4_exec_access_audit.py
      - tests/test_ext4_nosuid_policy_gate.py
      - tests/test_ext4_property_pipeline.py
      - tests/test_ext4_evidence_boundaries.py
      - build/r800_qemu_guest_abi.py
      - tests/test_qemu_ext4_property_service.py
      - tests/test_qemu_ext4_init_transition.py
      - src/initramfs/ext4-init-domain-probe.c
      - tests/test_qemu_prelabeled_mounts.py
      - build/r800_qemu_virt_contract.py
      - src/kernel/qemu-virt-block.config
      - src/initramfs/virt-readonly-disks.c
      - tests/test_qemu_readonly_disks.py
      - tests/test_qemu_virt_contract.py
      - build/r800_android_context_partitions.py
      - build/r800_android_apex_payload.py
      - tests/test_android_context_partitions.py
      - tests/test_android_system_ext4.py
      - tests/test_real_ext4_tools.py
      - build/r800_qemu_system_init.py
      - tests/test_rootfs_relabel_policy_gate.py
      - tests/test_property_pipeline.py
      - tests/test_qemu_property_service.py
      - src/android/rootfs-relabel-probe.c
      - tests/test_qemu_rootfs_relabel.py
      - src/android/selinux-transition-probe.c
      - tests/test_qemu_selinux_transition.py
      - build/r800_qemu_android_stock_policy.py
      - src/initramfs/android-stock-policy-probe.c
      - tests/test_qemu_android_stock_policy.py
      - build/r800_aosp_sepolicy_build.sh
      - tests/test_android_sepolicy_audit.py
      - build/r800_qemu_rootfs_preflight.py
      - tests/test_qemu_rootfs_preflight.py
      - src/initramfs/android-rootfs-preflight.c
      - tests/test_android_rootfs_preflight.py
      - tests/test_android_init_rootfs.py
      - tests/test_android_init_dependencies.py
      - src/android/property-service-harness.cpp
      - src/android/property-service-client.c
      - tests/test_android_init_inventory.py
      - src/android/property-info-generator.cpp
      - src/initramfs/bionic-property-area.c
      - build/r800_qemu_property_area.py
      - tests/test_qemu_property_area.py
      - tests/test_aosp_runtime_build.py
      - tests/test_android_gsi_import.py
      - build/r800_android_dynamic_audit.py
      - tests/test_android_runtime_extract.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-runtime-extraction:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install filesystem inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends e2fsprogs selinux-utils android-sdk-libsparse-utils gcc-aarch64-linux-gnu libc6-dev-arm64-cross
      - name: Verify exact commit and execute synthetic tests
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          bash -n build/r800_aosp_property_info.sh
          bash -n build/r800_aosp_init_service_build.sh
          bash -n build/r800_aosp_sepolicy_build.sh
          bash -n build/r800_aosp_galwear_policy_build.sh
          python3 -m unittest discover -s tests -p 'test_galwear_policy_fixture.py' -v
          bash -n build/r800_aosp_selinux_transition_build.sh
          python3 -m unittest discover -s tests -p 'test_qemu_selinux_transition.py' -v
          python3 -m unittest discover -s tests -p 'test_qemu_rootfs_relabel.py' -v
          python3 -m unittest discover -s tests -p 'test_qemu_property_service.py' -v
          python3 -m unittest discover -s tests -p 'test_property_pipeline.py' -v
          python3 -m unittest discover -s tests -p 'test_rootfs_relabel_policy_gate.py' -v
          python3 -m unittest discover -s tests -p 'test_android_system_ext4.py' -v
          command -v matchpathcon
          python3 -m unittest discover -s tests -p 'test_real_ext4_tools.py' -v
          python3 -m unittest discover -s tests -p 'test_qemu_readonly_disks.py' -v
          python3 -m unittest discover -s tests -p 'test_qemu_block_smoke.py' -v
          python3 -m unittest discover -s tests -p 'test_qemu_prelabeled_mounts.py' -v
          python3 -m unittest discover -s tests -p 'test_qemu_ext4_init_transition.py' -v
          python3 -m unittest discover -s tests -p 'test_qemu_ext4_property_service.py' -v
          python3 -m unittest discover -s tests -p 'test_ext4_property_pipeline.py' -v
          python3 -m unittest discover -s tests -p 'test_ext4_nosuid_policy_gate.py' -v
          python3 -m unittest discover -s tests -p 'test_ext4_exec_access_audit.py' -v
          python3 -m unittest discover -s tests -p 'test_ext4_evidence_boundaries.py' -v
          python3 -m compileall -q build tests
          python3 -m unittest discover -s tests -p 'test_qemu_virt_contract.py' -v
          aarch64-linux-gnu-gcc -std=c11 -Wall -Wextra -Werror -O2 -static src/initramfs/virt-readonly-disks.c -o "$RUNNER_TEMP/virt-disk-init"
          aarch64-linux-gnu-gcc -std=c11 -Wall -Wextra -Werror -O2 -static -DGALWEAR_LABEL_PROBE src/initramfs/virt-readonly-disks.c -o "$RUNNER_TEMP/virt-label-init"
          aarch64-linux-gnu-gcc -std=c11 -Wall -Wextra -Werror -O2 -static -DGALWEAR_LABEL_PROBE -DGALWEAR_TRANSITION_PROBE src/initramfs/virt-readonly-disks.c -o "$RUNNER_TEMP/virt-transition-init"
          aarch64-linux-gnu-gcc -std=c11 -Wall -Wextra -Werror -O2 -static -DGALWEAR_LABEL_PROBE -DGALWEAR_SERVICE_PROBE src/initramfs/virt-readonly-disks.c -o "$RUNNER_TEMP/virt-service-init"
          aarch64-linux-gnu-gcc -std=c11 -Wall -Wextra -Werror -O2 -static src/initramfs/ext4-init-domain-probe.c -o "$RUNNER_TEMP/ext4-second-stage"
          python3 -m unittest discover -s tests -p 'test_android_context_partitions.py' -v
          python3 -m unittest discover -s tests -p 'test_android_sepolicy_audit.py' -v
          python3 -m unittest discover -s tests -p 'test_qemu_android_stock_policy.py' -v
          aarch64-linux-gnu-gcc -std=c11 -Wall -Wextra -Werror -O2 -static src/initramfs/android-stock-policy-probe.c -o "$RUNNER_TEMP/stock-policy-init"
          python3 build/r800_initramfs_spec.py --init "$RUNNER_TEMP/stock-policy-init" --list "$RUNNER_TEMP/stock-policy-init.list" --report "$RUNNER_TEMP/stock-policy-compile.json"
          python3 -m unittest discover -s tests -p 'test_android_init_inventory.py' -v
          python3 -m unittest discover -s tests -p 'test_android_init_dependencies.py' -v
          python3 -m unittest discover -s tests -p 'test_android_init_rootfs.py' -v
          python3 -m unittest discover -s tests -p 'test_android_rootfs_preflight.py' -v
          python3 -m unittest discover -s tests -p 'test_qemu_rootfs_preflight.py' -v
          aarch64-linux-gnu-gcc -std=c11 -Wall -Wextra -Werror -O2 -static src/initramfs/android-rootfs-preflight.c -o "$RUNNER_TEMP/rootfs-preflight-init"
          python3 build/r800_initramfs_spec.py --init "$RUNNER_TEMP/rootfs-preflight-init" --list "$RUNNER_TEMP/rootfs-preflight.list" --report "$RUNNER_TEMP/rootfs-preflight-compile.json"
          python3 -m unittest discover -s tests -p 'test_qemu_property_area.py' -v
          command -v debugfs
          command -v mke2fs
          command -v simg2img
          python3 -m py_compile build/r800_android_runtime_extract.py build/r800_android_gsi_import.py
          python3 -m unittest discover -s tests -p 'test_android_runtime_extract.py' -v
          python3 -m unittest discover -s tests -p 'test_android_gsi_import.py' -v
          python3 -m unittest discover -s tests -p 'test_aosp_runtime_build.py' -v
