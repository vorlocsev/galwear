name: SM-R800 integrated regression and HAL compile (NON-RELEASE)
on:
  push:
    branches:
      - development/r800-integration-ci-20261125
      - development/r800-display-error-propagation-20261125
      - development/r800-integration-20261127
      - development/r800-integration-linker-20261127
  workflow_dispatch:
    inputs:
      kernel_repeatability:
        description: "Also run the two independent read-only-init kernel builds"
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: r800-integrated-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify checkout is exact triggering commit
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Install required DTB, AArch64 ELF and EXT4/SELinux regression tools
        run: |
          set -eu
          # Only Ubuntu's signed distribution repositories are required here.
          # Unrelated preinstalled third-party repositories must not block tests.
          test -s /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources \
            -o Dir::Etc::sourceparts=- -o Acquire::Retries=3 update
          sudo apt-get -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources \
            -o Dir::Etc::sourceparts=- -o Acquire::Retries=3 install -y --no-install-recommends \
            device-tree-compiler clang lld binutils e2fsprogs selinux-utils imagemagick fonts-dejavu-core
          for tool in dtc fdtget clang ld.lld readelf mke2fs e2fsck debugfs matchpathcon; do
            command -v "$tool"
          done
          clang --version
          ld.lld --version
          readelf --version
      - name: Compile experimental handover init without executing or embedding it
        if: github.ref_name == 'development/r800-integration-20261127'
        run: |
          set -eu
          out="$RUNNER_TEMP/r800-handover-init"
          sh src/initramfs/build.sh "$out"
          readelf -h -l -d --wide "$out/init" > "$out/elf.txt"
          grep -Eq 'Class:[[:space:]]*ELF64' "$out/elf.txt"
          grep -Eq 'Machine:[[:space:]]*AArch64' "$out/elf.txt"
          grep -Eq 'Type:[[:space:]]*EXEC' "$out/elf.txt"
          if grep -Eq 'INTERP|\(NEEDED\)' "$out/elf.txt"; then
            echo "Unexpected dynamic dependency"; exit 2
          fi
          sha256sum "$out/init"
          echo "HANDOVER_INIT_COMPILE_ONLY; not executed; safe_to_flash=false"
      - name: Verify native GPS bridge helpers and ARM32 objects (no vendor code execution)
        if: github.ref_name == 'development/r800-integration-20261127'
        run: |
          set -eu
          export LC_ALL=C
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          for suite in frame command lto lto_file output client cache cache_read; do
            case "$suite" in cache_read|lto_file) extra=-Wno-unused-function;; *) extra=;; esac
            cc -O2 -Wall -Wextra -Werror $extra -pthread -DR800_XTRA_ABI=0 -Isrc/tools/gps "tests/test_r800_gps_$suite.c" -o "$tmp/$suite"
            timeout 30 "$tmp/$suite"
            echo "PASS: native GPS $suite"
          done
          for abi in 0 1 2; do
            cc -O2 -Wall -Wextra -Werror -pthread -DR800_XTRA_ABI="$abi" -Isrc/tools/gps tests/test_r800_gps_xtra_submit.c -o "$tmp/xtra-$abi"
            timeout 30 "$tmp/xtra-$abi"
            clang --target=armv7a-linux-gnueabi -mfloat-abi=softfp -mfpu=vfpv3-d16 -DR800_XTRA_ABI="$abi" --no-default-config -nostdinc -O2 -fno-pic -fno-stack-protector -fno-builtin -ffreestanding -c src/tools/gps/gpsbridge.c -o "$tmp/bridge-$abi.o"
            readelf -h "$tmp/bridge-$abi.o" > "$tmp/bridge-$abi.header"
            readelf -rW "$tmp/bridge-$abi.o" > "$tmp/bridge-$abi.reloc"
            grep -Eq 'R_ARM_MOVW_ABS_NC[[:space:]].*[[:space:]]main([[:space:]]|$)' "$tmp/bridge-$abi.reloc"
            grep -Eq 'R_ARM_MOVT_ABS[[:space:]].*[[:space:]]main([[:space:]]|$)' "$tmp/bridge-$abi.reloc"
            grep -Eq 'Class:[[:space:]]*ELF32' "$tmp/bridge-$abi.header"
            grep -Eq 'Type:[[:space:]]*REL' "$tmp/bridge-$abi.header"
            grep -Eq 'Machine:[[:space:]]*ARM' "$tmp/bridge-$abi.header"
            echo "PASS: XTRA synthetic ABI $abi and ARM32 bridge object"
          done
          echo "GNSS_RUNTIME_VERIFIED=false; safe_to_flash=false"
      - name: Require actual charger asset test dependencies
        if: github.ref_name == 'development/r800-integration-20261127'
        run: |
          command -v convert || command -v magick
          test -f /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
      - name: Run all offline regression suites
        run: |
          python3 build/r800_integrated_regression.py --repo "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/r800-integrated-regression.json"
      - name: Check shell syntax and kernel patch format
        run: |
          for f in payload/android-helper.sh payload/start.sh payload/r800-display-watchdog.sh build/mkpayload-release.sh build/r800_hal_compile_smoke.sh; do
            sh -n "$f"
          done
          git apply --numstat src/kernel/r800-wearos.patch >/dev/null
      - name: Upload regression JSON even on test failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r800-integrated-regression-evidence
          path: ${{ runner.temp }}/r800-integrated-regression.json
          if-no-files-found: warn
          retention-days: 7
  hal-compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install exact NDK release without sdkmanager
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/android-ndk-r27c-linux.zip"
          curl --fail --location --retry 3 --connect-timeout 30 --max-time 600 \
            https://dl.google.com/android/repository/android-ndk-r27c-linux.zip -o "$archive"
          printf '%s  %s\n' 090e8083a715fdb1a3e402d0763c388abb03fb4e "$archive" | sha1sum --check -
          unzip -q "$archive" -d "$RUNNER_TEMP"
          rm -f "$archive"
          test -x "$RUNNER_TEMP/android-ndk-r27c/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi28-clang"
      - name: Fetch tinyalsa header source by immutable commit
        run: |
          git init "$RUNNER_TEMP/tinyalsa"
          git -C "$RUNNER_TEMP/tinyalsa" remote add origin https://github.com/tinyalsa/tinyalsa.git
          git -C "$RUNNER_TEMP/tinyalsa" fetch --depth=1 origin 1c5fb68ced57d838f2b7ecd0c00bc1fefc9ab60d
          git -C "$RUNNER_TEMP/tinyalsa" checkout --detach FETCH_HEAD
      - name: Compare DECON ABI against pinned kernel on ARM32 and ARM64
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          base=https://raw.githubusercontent.com/xanderlent/COMBINED_android-kernel-exynos/50db73fc799f20a7120a8b5f653b16cc123d856f
          curl --fail --location --retry 3 --max-time 90 "$base/drivers/video/fbdev/exynos/dpu30/decon.h" -o "$RUNNER_TEMP/decon.h"
          python3 build/r800_decon_abi_check.py \
            --kernel-header "$RUNNER_TEMP/decon.h" --mirror src/hal/r800_decon_abi.h \
            --ndk "$RUNNER_TEMP/android-ndk-r27c" --scratch "$RUNNER_TEMP/decon-layout"
      - name: Compile and link five HALs (Audio experimental)
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          sh build/r800_hal_compile_smoke.sh "$GITHUB_WORKSPACE" "$RUNNER_TEMP/android-ndk-r27c" "$RUNNER_TEMP/tinyalsa" "$RUNNER_TEMP/r800-hal"
      - name: Compile static ARM32 watch utilities (never execute)
        if: github.ref_name == 'development/r800-integration-20261127'
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          sh build/r800_build_tools.sh "$RUNNER_TEMP/android-ndk-r27c" "$RUNNER_TEMP/r800-tools"
          echo "STATIC_TOOLS_COMPILE_ONLY; safe_to_flash=false"
      - name: Compare NDK PCM ABI to pinned Exynos compat source
        run: |
          set -euo pipefail
          base=https://raw.githubusercontent.com/xanderlent/COMBINED_android-kernel-exynos/50db73fc799f20a7120a8b5f653b16cc123d856f
          curl --fail --location --retry 3 --max-time 90 "$base/sound/core/pcm_compat.c" -o "$RUNNER_TEMP/pcm_compat.c"
          curl --fail --location --retry 3 --max-time 90 "$base/include/uapi/sound/asound.h" -o "$RUNNER_TEMP/asound.h"
          python3 build/r800_pcm_compat_audit.py "$RUNNER_TEMP/r800-hal/hal-compile.json" "$RUNNER_TEMP/pcm_compat.c" "$RUNNER_TEMP/asound.h" "$RUNNER_TEMP/r800-hal/pcm-compat.json"
      - name: Upload JSON evidence only
        uses: actions/upload-artifact@v4
        with:
          name: r800-hal-compile-evidence
          path: |
            ${{ runner.temp }}/r800-hal/hal-compile.json
            ${{ runner.temp }}/r800-hal/pcm-compat.json
          if-no-files-found: error
          retention-days: 7
  kernel:
    if: github.event_name == 'workflow_dispatch' && inputs.kernel_repeatability
    uses: ./.github/workflows/r800-kernel-repeatability.yml
