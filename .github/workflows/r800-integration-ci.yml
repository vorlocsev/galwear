name: SM-R800 integrated regression and HAL link (NON-RELEASE)
on:
  push:
    branches:
      - development/r800-hwc-adapter-abi-20261125
  workflow_dispatch:
    inputs:
      kernel_repeatability:
        description: "Also run the two independent read-only-init kernel builds"
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: r800-integrated-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify checkout is exact triggering commit
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Install host test dependencies
        run: sudo apt-get update && sudo apt-get install -y busybox
      - name: Run all offline regression suites
        run: |
          python3 build/r800_integrated_regression.py --repo "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/r800-integrated-regression.json"
      - name: Check shell syntax and kernel patch format
        run: |
          for f in payload/android-helper.sh payload/start.sh payload/r800-display-watchdog.sh build/mkpayload-release.sh build/r800_hal_link_smoke.sh; do
            sh -n "$f"
          done
          git apply --numstat src/kernel/r800-wearos.patch >/dev/null
      - name: Upload regression JSON even on test failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r800-integrated-regression-evidence
          path: ${{ runner.temp }}/r800-integrated-regression.json
          if-no-files-found: warn
          retention-days: 7
  hal-link:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install exact NDK release
        run: |
          sdkmanager --install "ndk;27.2.12479018"
      - name: Fetch tinyalsa header source by immutable commit
        run: |
          git init "$RUNNER_TEMP/tinyalsa"
          git -C "$RUNNER_TEMP/tinyalsa" remote add origin https://github.com/tinyalsa/tinyalsa.git
          git -C "$RUNNER_TEMP/tinyalsa" fetch --depth=1 origin 1c5fb68ced57d838f2b7ecd0c00bc1fefc9ab60d
          git -C "$RUNNER_TEMP/tinyalsa" checkout --detach FETCH_HEAD
      - name: Verify pinned kernel DECON layout on ARM32 and ARM64
        run: |
          git init "$RUNNER_TEMP/decon-source"
          git -C "$RUNNER_TEMP/decon-source" remote add origin https://github.com/xanderlent/COMBINED_android-kernel-exynos.git
          git -C "$RUNNER_TEMP/decon-source" fetch --depth=1 --filter=blob:none origin 50db73fc799f20a7120a8b5f653b16cc123d856f
          test "$(git -C "$RUNNER_TEMP/decon-source" rev-parse FETCH_HEAD)" = 50db73fc799f20a7120a8b5f653b16cc123d856f
          git -C "$RUNNER_TEMP/decon-source" show FETCH_HEAD:drivers/video/fbdev/exynos/dpu30/decon.h > "$RUNNER_TEMP/decon.h"
          python3 build/r800_decon_abi_check.py --kernel-header "$RUNNER_TEMP/decon.h" --mirror src/hal/r800_decon_abi.h --ndk "$ANDROID_HOME/ndk/27.2.12479018" --scratch "$RUNNER_TEMP/decon-abi"
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          report = {"schema": "galwear-r800-decon-abi-v1", "status": "LAYOUT_COMPILED_BOTH_ABIS",
                    "commit": os.environ["GITHUB_SHA"], "run_id": os.environ["GITHUB_RUN_ID"],
                    "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"], "source_commit": "50db73fc799f20a7120a8b5f653b16cc123d856f",
                    "targets": ["armv7a", "aarch64"], "mirror_sha256": hashlib.sha256(Path("src/hal/r800_decon_abi.h").read_bytes()).hexdigest(),
                    "safe_to_flash": False}
          (Path(os.environ["RUNNER_TEMP"]) / "decon-abi.json").write_text(json.dumps(report) + "\n")
          PY
      - name: Check full kernel patch against pinned source
        run: |
          sh build/r800_aosp_source_probe.sh "$GITHUB_WORKSPACE" "$RUNNER_TEMP/r800-patch-source" "$RUNNER_TEMP/r800-patch-check.json"
      - name: Compile and link all four HALs
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          sh build/r800_hal_link_smoke.sh "$GITHUB_WORKSPACE" "$ANDROID_HOME/ndk/27.2.12479018" "$RUNNER_TEMP/tinyalsa" "$RUNNER_TEMP/r800-hal"
      - name: Collect mandatory JSON reports
        run: |
          mkdir "$RUNNER_TEMP/hal-evidence"
          cp "$RUNNER_TEMP/r800-hal/objects/hal-compile.json" "$RUNNER_TEMP/r800-hal/hal-link.json" "$RUNNER_TEMP/decon-abi.json" "$RUNNER_TEMP/r800-patch-check.json" "$RUNNER_TEMP/hal-evidence/"
      - name: Upload JSON evidence only
        uses: actions/upload-artifact@v4
        with:
          name: r800-hal-link-evidence
          path: ${{ runner.temp }}/hal-evidence/*.json
          if-no-files-found: error
          retention-days: 7
  integration-evidence:
    needs: [regression, hal-link]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: r800-integrated-regression-evidence
          path: ${{ runner.temp }}/integration
      - uses: actions/download-artifact@v4
        with:
          name: r800-hal-link-evidence
          path: ${{ runner.temp }}/integration
      - name: Validate same-head and same-attempt evidence
        run: |
          python3 build/r800_integration_evidence.py --repo "$GITHUB_WORKSPACE" --directory "$RUNNER_TEMP/integration" --commit "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --output "$RUNNER_TEMP/integration-evidence.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r800-integration-evidence
          path: ${{ runner.temp }}/integration-evidence.json
          if-no-files-found: warn
          retention-days: 7
  kernel:
    if: github.event_name == 'workflow_dispatch' && inputs.kernel_repeatability
    uses: ./.github/workflows/r800-kernel-repeatability.yml
