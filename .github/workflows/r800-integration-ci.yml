name: SM-R800 integrated regression and HAL compile (NON-RELEASE)
on:
  push:
    branches:
      - development/r800-integration-ci-20261125
      - development/r800-display-error-propagation-20261125
      - development/r800-integration-20261127
      - development/r800-integration-linker-20261127
  workflow_dispatch:
    inputs:
      kernel_repeatability:
        description: "Also run the two independent read-only-init kernel builds"
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: r800-integrated-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify checkout is exact triggering commit
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Install required DTB, AArch64 ELF and EXT4/SELinux regression tools
        run: |
          set -eu
          # Only Ubuntu's signed distribution repositories are required here.
          # Unrelated preinstalled third-party repositories must not block tests.
          test -s /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources \
            -o Dir::Etc::sourceparts=- -o Acquire::Retries=3 update
          sudo apt-get -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources \
            -o Dir::Etc::sourceparts=- -o Acquire::Retries=3 install -y --no-install-recommends \
            device-tree-compiler clang lld binutils e2fsprogs selinux-utils secilc imagemagick fonts-dejavu-core
          for tool in dtc fdtget clang ld.lld readelf mke2fs e2fsck debugfs matchpathcon; do
            command -v "$tool"
          done
          clang --version
          ld.lld --version
          readelf --version
      - name: Compile experimental handover init without executing or embedding it
        if: github.ref_name == 'development/r800-integration-20261127'
        run: |
          set -eu
          out="$RUNNER_TEMP/r800-handover-init"
          sh src/initramfs/build.sh "$out"
          readelf -h -l -d --wide "$out/init" > "$out/elf.txt"
          grep -Eq 'Class:[[:space:]]*ELF64' "$out/elf.txt"
          grep -Eq 'Machine:[[:space:]]*AArch64' "$out/elf.txt"
          grep -Eq 'Type:[[:space:]]*EXEC' "$out/elf.txt"
          if grep -Eq 'INTERP|\(NEEDED\)' "$out/elf.txt"; then
            echo "Unexpected dynamic dependency"; exit 2
          fi
          sha256sum "$out/init"
          echo "HANDOVER_INIT_COMPILE_ONLY; not executed; safe_to_flash=false"
      - name: Verify native GPS bridge helpers and ARM32 objects (no vendor code execution)
        if: github.ref_name == 'development/r800-integration-20261127'
        run: |
          set -eu
          export LC_ALL=C
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          for suite in frame command lto lto_file output client cache cache_read; do
            case "$suite" in cache_read|lto_file) extra=-Wno-unused-function;; *) extra=;; esac
            cc -O2 -Wall -Wextra -Werror $extra -pthread -DR800_XTRA_ABI=0 -Isrc/tools/gps "tests/test_r800_gps_$suite.c" -o "$tmp/$suite"
            timeout 30 "$tmp/$suite"
            echo "PASS: native GPS $suite"
          done
          for abi in 0 1 2; do
            cc -O2 -Wall -Wextra -Werror -pthread -DR800_XTRA_ABI="$abi" -Isrc/tools/gps tests/test_r800_gps_xtra_submit.c -o "$tmp/xtra-$abi"
            timeout 30 "$tmp/xtra-$abi"
            clang --target=armv7a-linux-gnueabi -mfloat-abi=softfp -mfpu=vfpv3-d16 -DR800_XTRA_ABI="$abi" --no-default-config -nostdinc -O2 -fno-pic -fno-stack-protector -fno-builtin -ffreestanding -c src/tools/gps/gpsbridge.c -o "$tmp/bridge-$abi.o"
            readelf -h "$tmp/bridge-$abi.o" > "$tmp/bridge-$abi.header"
            readelf -rW "$tmp/bridge-$abi.o" > "$tmp/bridge-$abi.reloc"
            readelf -sW "$tmp/bridge-$abi.o" > "$tmp/bridge-$abi.symbols"
            if grep -Eq 'UND[[:space:]]+__aeabi_(l|ul)divmod([[:space:]]|$)' "$tmp/bridge-$abi.symbols"; then
              echo "Unexpected 64-bit division helper in freestanding GPSBridge" >&2
              exit 2
            fi
            grep -Eq 'R_ARM_MOVW_ABS_NC[[:space:]].*[[:space:]]main([[:space:]]|$)' "$tmp/bridge-$abi.reloc"
            grep -Eq 'R_ARM_MOVT_ABS[[:space:]].*[[:space:]]main([[:space:]]|$)' "$tmp/bridge-$abi.reloc"
            grep -Eq 'Class:[[:space:]]*ELF32' "$tmp/bridge-$abi.header"
            grep -Eq 'Type:[[:space:]]*REL' "$tmp/bridge-$abi.header"
            grep -Eq 'Machine:[[:space:]]*ARM' "$tmp/bridge-$abi.header"
            echo "PASS: XTRA synthetic ABI $abi and ARM32 bridge object"
          done
          echo "GNSS_RUNTIME_VERIFIED=false; safe_to_flash=false"
      - name: Require actual charger asset test dependencies
        if: github.ref_name == 'development/r800-integration-20261127'
        run: |
          command -v convert || command -v magick
          test -f /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
      - name: Compile synthetic CIL and reject a neverallow violation
        if: github.ref_name == 'development/r800-integration-20261127'
        run: |
          command -v secilc
          python3 build/r800_donor_cil_compile.py --fixture --report "$RUNNER_TEMP/r800-cil-evidence.json"
      - name: Upload CIL compile evidence
        if: always() && github.ref_name == 'development/r800-integration-20261127'
        uses: actions/upload-artifact@v4
        with:
          name: r800-cil-compile-evidence
          path: ${{ runner.temp }}/r800-cil-evidence.json
          if-no-files-found: warn
          retention-days: 7
      - name: Run all offline regression suites
        run: |
          python3 build/r800_integrated_regression.py --repo "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/r800-integrated-regression.json"
      - name: Check shell syntax and kernel patch format
        run: |
          for f in payload/android-helper.sh payload/start.sh payload/r800-display-watchdog.sh build/mkpayload-release.sh build/r800_hal_compile_smoke.sh; do
            sh -n "$f"
          done
          git apply --numstat src/kernel/r800-wearos.patch >/dev/null
      - name: Upload regression JSON even on test failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r800-integrated-regression-evidence
          path: ${{ runner.temp }}/r800-integrated-regression.json
          if-no-files-found: warn
          retention-days: 7
  hal-compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install exact NDK release without sdkmanager
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/android-ndk-r27c-linux.zip"
          curl --fail --location --retry 3 --connect-timeout 30 --max-time 600 \
            https://dl.google.com/android/repository/android-ndk-r27c-linux.zip -o "$archive"
          printf '%s  %s\n' 090e8083a715fdb1a3e402d0763c388abb03fb4e "$archive" | sha1sum --check -
          unzip -q "$archive" -d "$RUNNER_TEMP"
          rm -f "$archive"
          test -x "$RUNNER_TEMP/android-ndk-r27c/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi28-clang"
      - name: Fetch tinyalsa header source by immutable commit
        run: |
          git init "$RUNNER_TEMP/tinyalsa"
          git -C "$RUNNER_TEMP/tinyalsa" remote add origin https://github.com/tinyalsa/tinyalsa.git
          git -C "$RUNNER_TEMP/tinyalsa" fetch --depth=1 origin 1c5fb68ced57d838f2b7ecd0c00bc1fefc9ab60d
          git -C "$RUNNER_TEMP/tinyalsa" checkout --detach FETCH_HEAD
      - name: Compare DECON ABI against pinned kernel on ARM32 and ARM64
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          base=https://raw.githubusercontent.com/xanderlent/COMBINED_android-kernel-exynos/50db73fc799f20a7120a8b5f653b16cc123d856f
          curl --fail --location --retry 3 --max-time 90 "$base/drivers/video/fbdev/exynos/dpu30/decon.h" -o "$RUNNER_TEMP/decon.h"
          python3 build/r800_decon_abi_check.py \
            --kernel-header "$RUNNER_TEMP/decon.h" --mirror src/hal/r800_decon_abi.h \
            --ndk "$RUNNER_TEMP/android-ndk-r27c" --scratch "$RUNNER_TEMP/decon-layout"
      - name: Compile and link five HALs (Audio experimental)
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          sh build/r800_hal_compile_smoke.sh "$GITHUB_WORKSPACE" "$RUNNER_TEMP/android-ndk-r27c" "$RUNNER_TEMP/tinyalsa" "$RUNNER_TEMP/r800-hal"
      - name: Compile static ARM32 watch utilities (never execute)
        if: github.ref_name == 'development/r800-integration-20261127'
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          sh build/r800_build_tools.sh "$RUNNER_TEMP/android-ndk-r27c" "$RUNNER_TEMP/r800-tools"
          echo "STATIC_TOOLS_COMPILE_ONLY; safe_to_flash=false"
      - name: Compare NDK PCM ABI to pinned Exynos compat source
        run: |
          set -euo pipefail
          base=https://raw.githubusercontent.com/xanderlent/COMBINED_android-kernel-exynos/50db73fc799f20a7120a8b5f653b16cc123d856f
          curl --fail --location --retry 3 --max-time 90 "$base/sound/core/pcm_compat.c" -o "$RUNNER_TEMP/pcm_compat.c"
          curl --fail --location --retry 3 --max-time 90 "$base/include/uapi/sound/asound.h" -o "$RUNNER_TEMP/asound.h"
          python3 build/r800_pcm_compat_audit.py "$RUNNER_TEMP/r800-hal/hal-compile.json" "$RUNNER_TEMP/pcm_compat.c" "$RUNNER_TEMP/asound.h" "$RUNNER_TEMP/r800-hal/pcm-compat.json"
      - name: Upload JSON evidence only
        uses: actions/upload-artifact@v4
        with:
          name: r800-hal-compile-evidence
          path: |
            ${{ runner.temp }}/r800-hal/hal-compile.json
            ${{ runner.temp }}/r800-hal/pcm-compat.json
          if-no-files-found: error
          retention-days: 7
      - name: Compile Broadcom Bluetooth vendor library (ARM32, no radio access)
        if: github.ref_name == 'development/r800-integration-20261127'
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          sh src/vendor/libbt/build.sh "$RUNNER_TEMP/android-ndk-r27c" "$RUNNER_TEMP/r800-bt"
          echo "BLUETOOTH_COMPILE_ONLY; runtime_verified=false; safe_to_flash=false"
      - name: Upload Bluetooth text evidence only
        if: always() && github.ref_name == 'development/r800-integration-20261127'
        uses: actions/upload-artifact@v4
        with:
          name: r800-bluetooth-compile-evidence
          path: |
            ${{ runner.temp }}/r800-bt/bt-build-evidence.txt
            ${{ runner.temp }}/r800-bt/libbt-vendor.elf.txt
          if-no-files-found: warn
          retention-days: 7
      - name: Install Android API 30 and Build Tools 30.0.3
        if: github.ref_name == 'development/r800-integration-20261127'
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          command -v javac
          # The hosted runner no longer exposes sdkmanager. Resolve exact
          # SDK packages from Google's repository metadata and verify archives.
          sdk="$RUNNER_TEMP/r800-android-sdk"
          mkdir "$sdk"
          export SDK_STAGE="$sdk"
          python3 - <<'PY'
          import hashlib
          import os
          import pathlib
          import subprocess
          import xml.etree.ElementTree as ET

          root = pathlib.Path(os.environ["SDK_STAGE"])
          base = "https://dl.google.com/android/repository/"
          def fetch(url, dest):
              subprocess.run(["curl", "--fail", "--location", "--retry", "3",
                              "--connect-timeout", "30", "--max-time", "300",
                              url, "-o", str(dest)], check=True)
          meta = root / "repository.xml"
          fetch(base + "repository2-1.xml", meta)
          doc = ET.parse(meta).getroot()
          for elem in doc.iter():
              elem.tag = elem.tag.rsplit("}", 1)[-1]
          for package, target in (("platforms;android-30", "platform"),
                                  ("build-tools;30.0.3", "build-tools")):
              matches = [p for p in doc.iter("remotePackage") if p.get("path") == package]
              assert len(matches) == 1, (package, len(matches))
              archives = [a for a in matches[0].findall("./archives/archive")
                          if a.findtext("host-os") in (None, "linux")
                          and a.findtext("host-bits") in (None, "64")]
              assert len(archives) == 1, (package, len(archives))
              complete = archives[0].find("complete")
              filename = complete.findtext("url")
              assert filename and pathlib.PurePosixPath(filename).name == filename
              checksum = complete.find("checksum")
              expected = checksum.text.strip().lower()
              algorithm = {40: "sha1", 64: "sha256"}[len(expected)]
              archive = root / filename
              fetch(base + filename, archive)
              assert archive.stat().st_size == int(complete.findtext("size"))
              with archive.open("rb") as stream:
                  actual = hashlib.file_digest(stream, algorithm).hexdigest()
              assert actual == expected, (package, algorithm)
              print(package, filename, algorithm, actual, flush=True)
              subprocess.run(["unzip", "-q", str(archive), "-d", str(root / target)], check=True)
              archive.unlink()
          PY
          jar=$(find "$sdk/platform" -type f -name android.jar)
          d8=$(find "$sdk/build-tools" -type f -name d8)
          test -s "$jar"
          test -x "$d8"
          test -x "$(dirname "$d8")/dexdump"
          printf 'R800_ANDROID_JAR=%s\nR800_BUILD_TOOLS=%s\n' "$jar" "$(dirname "$d8")" >> "$GITHUB_ENV"
      - name: Compile KeepWifi Java and inspect DEX (never execute)
        if: github.ref_name == 'development/r800-integration-20261127'
        run: |
          set -eu
          sh src/tools/keepwifi/build.sh "$R800_ANDROID_JAR" "$R800_BUILD_TOOLS" "$RUNNER_TEMP/r800-keepwifi"
          echo "KEEPWIFI_COMPILE_ONLY; runtime_verified=false; safe_to_flash=false"
      - name: Upload KeepWifi text evidence only
        if: always() && github.ref_name == 'development/r800-integration-20261127'
        uses: actions/upload-artifact@v4
        with:
          name: r800-keepwifi-compile-evidence
          path: |
            ${{ runner.temp }}/r800-keepwifi/keepwifi-build-evidence.txt
            ${{ runner.temp }}/r800-keepwifi/keepwifi-dex-evidence.txt
          if-no-files-found: warn
          retention-days: 7
      - name: Install ARM EABI build dependencies for BusyBox and Wi-Fi tools
        if: github.ref_name == 'development/r800-integration-20261127'
        run: |
          set -eu
          test -s /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources \
            -o Dir::Etc::sourceparts=- -o Acquire::Retries=3 update
          sudo apt-get -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources \
            -o Dir::Etc::sourceparts=- -o Acquire::Retries=3 install -y --no-install-recommends \
            gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi libc6-dev-armel-cross \
            qemu-user make flex bison pkg-config
      - name: Build static BusyBox and Wi-Fi utilities (inventory and version only)
        if: github.ref_name == 'development/r800-integration-20261127'
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          sh build/r800_build_busybox.sh "$RUNNER_TEMP/r800-busybox"
          sh build/r800_build_wifi_tools.sh "$RUNNER_TEMP/r800-wifi"
      - name: Assemble and verify real same-run partial component tree
        if: github.ref_name == 'development/r800-integration-20261127'
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 build/r800_stage_components.py \
            --hal-dir "$RUNNER_TEMP/r800-hal" --vendor-sources src/vendor \
            --tools "$RUNNER_TEMP/r800-tools" --bluetooth "$RUNNER_TEMP/r800-bt" \
            --keepwifi "$RUNNER_TEMP/r800-keepwifi" --busybox "$RUNNER_TEMP/r800-busybox" \
            --wifi "$RUNNER_TEMP/r800-wifi" --output "$RUNNER_TEMP/r800-components" \
            --source-sha "$GITHUB_SHA"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, stat
          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "r800-components"
          report = json.loads((root / "component-evidence.json").read_text())
          assert report["source_sha"] == os.environ["GITHUB_SHA"]
          assert report["status"] == "PARTIAL_COMPILED_COMPONENTS_ONLY"
          for flag in ("payload_complete", "vendor_image_built", "runtime_verified", "safe_to_flash"):
              assert report[flag] is False, flag
          actual = set()
          for p in root.rglob("*"):
              assert not p.is_symlink(), p
              if not p.is_file():
                  continue
              name = p.relative_to(root).as_posix()
              if name == "component-evidence.json":
                  continue
              actual.add(name)
              expected = report["files"][name]
              assert p.stat().st_size == expected["bytes"], name
              assert oct(stat.S_IMODE(p.stat().st_mode)) == expected["mode"], name
              assert hashlib.sha256(p.read_bytes()).hexdigest() == expected["sha256"], name
          assert actual == set(report["files"])
          assert "unlinked/gpsbridge.o" in actual
          assert "payload/keepwifi.dex" in actual
          assert "payload/fw/bt/libbt-vendor.so" in actual
          print("REAL_COMPONENT_TREE_PASS", len(actual), "files; safe_to_flash=false")
          PY
      - name: Audit real component tree and enforce missing donor hold
        if: github.ref_name == 'development/r800-integration-20261127'
        run: |
          set -eu
          mkdir "$RUNNER_TEMP/r800-empty-donors"
          rc=0
          python3 build/r800_donor_preflight.py \
            --donors "$RUNNER_TEMP/r800-empty-donors" \
            --components "$RUNNER_TEMP/r800-components" --source-sha "$GITHUB_SHA" \
            > "$RUNNER_TEMP/r800-donor-hold-evidence.json" || rc=$?
          test "$rc" -eq 2
          python3 - <<'PY'
          import json, os, pathlib
          p = pathlib.Path(os.environ["RUNNER_TEMP"]) / "r800-donor-hold-evidence.json"
          r = json.loads(p.read_text())
          assert r["status"] == "DONOR_INPUTS_INCOMPLETE"
          c = r["inputs"]["compiled-components"]
          assert c["status"] == "STRUCTURE_PASS_ONLY"
          assert c["source_sha"] == os.environ["GITHUB_SHA"]
          assert c["files"] > 0
          assert "compiled-components" not in r["blockers"]
          expected = {"samsung/combination.tar.md5", "samsung/boot-template.img",
                      "android/base-vendor.img", "android/j4-vendor.img", "android/system",
                      "tizen/libc.so.6", "tizen/libdl.so.2", "tizen/libpthread.so.0",
                      "tizen/ld-linux.so.3"}
          assert expected <= set(r["blockers"])
          for name, row in r["inputs"].items():
              if name != "compiled-components":
                  assert row["status"] == "MISSING", (name, row)
          for flag in ("donor_authenticity_verified", "hidl_dependency_closure_verified",
                       "persistent_input_verified", "pit_verified", "runtime_verified", "safe_to_flash"):
              assert r[flag] is False, flag
          print("REAL_COMPONENT_ACCEPTANCE_PASS", c["files"], "files")
          print("EXPECTED_DONOR_HOLD", len(r["blockers"]), "missing inputs")
          PY
      - name: Reject stale source SHA and tampered real component bytes
        if: github.ref_name == 'development/r800-integration-20261127'
        run: |
          set -eu
          PYTHONPATH=build python3 - <<'PY'
          import os, pathlib, shutil
          from r800_donor_preflight import verify_components
          tmp = pathlib.Path(os.environ["RUNNER_TEMP"])
          root = tmp / "r800-components"
          sha = os.environ["GITHUB_SHA"]
          stale = ("0" if sha[0] != "0" else "1") + sha[1:]
          try:
              verify_components(root, stale)
          except ValueError as exc:
              assert "source SHA mismatch" in str(exc)
          else:
              raise AssertionError("Stale SHA accepted")
          copy = tmp / "r800-components-negative"
          shutil.copytree(root, copy)
          p = copy / "payload/keepwifi.dex"
          raw = p.read_bytes()
          p.write_bytes(bytes([raw[0] ^ 1]) + raw[1:])
          try:
              verify_components(copy, sha)
          except ValueError as exc:
              assert "Component hash mismatch" in str(exc)
          else:
              raise AssertionError("Tampered component accepted")
          finally:
              shutil.rmtree(copy)
          verify_components(root, sha)
          print("REAL_COMPONENT_NEGATIVE_TESTS_PASS")
          PY
      - name: Upload component manifest only (no binaries)
        if: always() && github.ref_name == 'development/r800-integration-20261127'
        uses: actions/upload-artifact@v4
        with:
          name: r800-real-component-stage-evidence
          path: |
            ${{ runner.temp }}/r800-components/component-evidence.json
            ${{ runner.temp }}/r800-components/hal-stage-evidence.json
            ${{ runner.temp }}/r800-donor-hold-evidence.json
          if-no-files-found: warn
          retention-days: 7
      - name: Fetch Debian ARM EABI glibc 2.24 reference (not a Tizen donor)
        if: github.ref_name == 'development/r800-integration-20261127'
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          ref="$RUNNER_TEMP/r800-debian-glibc-reference"
          mkdir "$ref"
          export REF_DIR="$ref"
          python3 - <<'PY'
          import hashlib, json, lzma, os, pathlib, subprocess, tarfile
          root = pathlib.Path(os.environ["REF_DIR"])
          base = "https://archive.debian.org/debian/"
          def fetch(path, dest):
              subprocess.run(["curl", "--fail", "--location", "--retry", "3",
                              "--max-time", "180", base + path, "-o", str(dest)], check=True)
          index = root / "Packages.xz"
          fetch("dists/stretch/main/binary-armel/Packages.xz", index)
          rows = []
          with lzma.open(index, "rt", encoding="utf-8") as stream:
              for stanza in stream.read().split("\n\n"):
                  fields = dict(line.split(": ", 1) for line in stanza.splitlines()
                                if ": " in line and not line.startswith(" "))
                  if (fields.get("Package"), fields.get("Version"), fields.get("Architecture")) == (
                          "libc6", "2.24-11+deb9u4", "armel"):
                      rows.append(fields)
          assert len(rows) == 1, len(rows)
          row = rows[0]
          name = "pool/main/g/glibc/libc6_2.24-11+deb9u4_armel.deb"
          assert row["Filename"] == name
          archive = root / "reference.deb"
          fetch(name, archive)
          data = archive.read_bytes()
          assert len(data) == int(row["Size"]) and len(data) < 16 * 1024**2
          sha = hashlib.sha256(data).hexdigest()
          assert sha == row["SHA256"]
          # Pin the observed reference archive as well as the repository metadata.
          assert sha == "601950cfcf0e9f705d9a2bff65351dd6e86759cb6573d5ca6ba6cbe98ffaf5d8"
          names = {"libc-2.24.so": "libc.so.6", "libdl-2.24.so": "libdl.so.2",
                   "libpthread-2.24.so": "libpthread.so.0", "ld-2.24.so": "ld-linux.so.3"}
          libs = root / "libs"
          libs.mkdir()
          found = {}
          with subprocess.Popen(["dpkg-deb", "--fsys-tarfile", str(archive)], stdout=subprocess.PIPE) as proc:
              with tarfile.open(fileobj=proc.stdout, mode="r|*") as tar:
                  for member in tar:
                      path = pathlib.PurePosixPath(member.name)
                      if path.parent.as_posix() != "lib/arm-linux-gnueabi" or path.name not in names:
                          continue
                      dest = names[path.name]
                      assert dest not in found and member.isfile() and 0 < member.size <= 64 * 1024**2
                      raw = tar.extractfile(member).read()
                      assert len(raw) == member.size
                      (libs / dest).write_bytes(raw)
                      found[dest] = hashlib.sha256(raw).hexdigest()
              assert proc.wait() == 0
          assert set(found) == set(names.values()), found
          report = {"scope": "DEBIAN_ARMEL_REFERENCE_NOT_TIZEN",
                    "source_sha": os.environ["GITHUB_SHA"], "archive_sha256": sha,
                    "index_sha256": hashlib.sha256(index.read_bytes()).hexdigest(),
                    "index_signature_verified": False, "files": found,
                    "tizen_donor_verified": False, "runtime_verified": False, "safe_to_flash": False}
          (root / "reference-origin.json").write_text(json.dumps(report, indent=2, sort_keys=True))
          PY
      - name: Static reference glibc audit and real GPSBridge link (no ARM execution)
        if: github.ref_name == 'development/r800-integration-20261127'
        run: |
          set -eu
          ref="$RUNNER_TEMP/r800-debian-glibc-reference"
          PYTHONPATH=build python3 - <<'PY' > "$ref/reference-symbol-review.json"
          import json, os, pathlib
          from r800_android_linker_audit import inspect
          from r800_gps_link_gate import DONORS
          from r800_android_userspace_preflight import read_regular
          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "r800-debian-glibc-reference/libs"
          report = {}
          for name in DONORS:
              try:
                  info = inspect(read_regular(root / name, 64 * 1024**2))
                  report[name] = {key: info[key] for key in
                      ("abi", "soname", "elf_type", "needed", "dynamic_symbol_count",
                       "symbol_table_status", "unsupported_symbols")}
              except (OSError, ValueError) as exc:
                  report[name] = {"error": str(exc)}
          print(json.dumps({"scope": "DEBIAN_REFERENCE_DIAGNOSTIC_ONLY",
                            "libraries": report, "safe_to_flash": False}, indent=2, sort_keys=True))
          PY
          cat "$ref/reference-symbol-review.json"
          python3 build/r800_gps_link_gate.py --donor-only --libdir "$ref/libs" > "$ref/reference-prelink.json" || {
            cat "$ref/reference-prelink.json"; exit 2;
          }
          R800_XTRA_ABI=0 R800_TIZEN_ARCHIVE='' R800_HOST_SNAPSHOT=0 \
            sh src/tools/gps/build.sh "$RUNNER_TEMP/android-ndk-r27c" "$ref/libs" "$ref/gpsbridge" > "$ref/reference-link.log" 2>&1 || {
              cat "$ref/reference-link.log"; exit 2;
            }
          python3 build/r800_gps_link_gate.py --binary "$ref/gpsbridge" --libdir "$ref/libs" > "$ref/reference-postlink.json"
          echo "DEBIAN_ARMEL_REFERENCE_LINK_PASS; tizen_donor_verified=false; runtime_verified=false; safe_to_flash=false"
      - name: Compare two independent real GPSBridge links for each reference XTRA ABI
        if: github.ref_name == 'development/r800-integration-20261127'
        run: |
          set -eu
          ref="$RUNNER_TEMP/r800-debian-glibc-reference"
          for abi in 0 1 2; do
            R800_TIZEN_ARCHIVE='' R800_HOST_SNAPSHOT=0 python3 build/r800_gps_repeatability.py \
              --ndk "$RUNNER_TEMP/android-ndk-r27c" --donor "$ref/libs" --xtra-abi "$abi" \
              > "$ref/reference-repeatability-$abi.json" || {
                cat "$ref/reference-repeatability-$abi.json"; exit 2;
              }
          done
          python3 - <<'PY'
          import json, os, pathlib
          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "r800-debian-glibc-reference"
          origin = json.loads((root / "reference-origin.json").read_text())
          postlink = json.loads((root / "reference-postlink.json").read_text())
          hashes = {}
          for abi in (0, 1, 2):
              report = json.loads((root / f"reference-repeatability-{abi}.json").read_text())
              assert report["status"] == "LOCAL_REPEATABILITY_PASS"
              assert report["xtra_abi"] == abi and report["differences"] == []
              assert len(report["runs"]) == 2 and report["runs"][0] == report["runs"][1]
              for flag in ("independent_hosts_tested", "runtime_verified", "safe_to_flash"):
                  assert report[flag] is False
              record = report["runs"][0]
              assert record["donor_sha256"] == origin["files"]
              hashes[str(abi)] = record["binary_sha256"]
              if abi == 0:
                  assert record["binary_sha256"] == postlink["sha256"]
          assert len(set(hashes.values())) == 3, "Distinct XTRA ABI binaries must not be conflated"
          summary = {"status": "DEBIAN_REFERENCE_SAME_HOST_REPEATABILITY_PASS",
                     "source_sha": os.environ["GITHUB_SHA"], "binary_sha256_by_abi": hashes,
                     "builds_compared": 6, "tizen_donor_verified": False,
                     "independent_hosts_tested": False, "runtime_verified": False, "safe_to_flash": False}
          (root / "reference-repeatability-summary.json").write_text(json.dumps(summary, indent=2, sort_keys=True))
          print(summary["status"], hashes)
          PY
      - name: Upload reference link metadata only (no guest binaries)
        if: always() && github.ref_name == 'development/r800-integration-20261127'
        uses: actions/upload-artifact@v4
        with:
          name: r800-debian-glibc-reference-evidence
          path: |
            ${{ runner.temp }}/r800-debian-glibc-reference/reference-origin.json
            ${{ runner.temp }}/r800-debian-glibc-reference/reference-prelink.json
            ${{ runner.temp }}/r800-debian-glibc-reference/reference-symbol-review.json
            ${{ runner.temp }}/r800-debian-glibc-reference/reference-postlink.json
            ${{ runner.temp }}/r800-debian-glibc-reference/reference-link.log
            ${{ runner.temp }}/r800-debian-glibc-reference/reference-repeatability-*.json
          if-no-files-found: warn
          retention-days: 7
  qemu-reference:
    if: github.ref_name == 'development/r800-integration-20261127'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify exact checkout and install isolated QEMU tools
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(id -u)" -ne 0
          test -s /etc/apt/sources.list
          sudo apt-get -o Dir::Etc::sourcelist=/etc/apt/sources.list -o Dir::Etc::sourceparts=- -o Acquire::Retries=3 update
          sudo apt-get -o Dir::Etc::sourcelist=/etc/apt/sources.list -o Dir::Etc::sourceparts=- -o Acquire::Retries=3 install -y --no-install-recommends qemu-user-static bubblewrap
          qemu-arm-static --version
          bwrap --version
      - name: Verify full isolation before building or executing guest
        run: |
          set -eu
          scratch=$(mktemp -d)
          trap 'rm -rf "$scratch"' EXIT
          mkdir "$scratch/dev" "$scratch/proc"
          touch "$scratch/qemu"
          qemu=$(realpath "$(command -v qemu-arm-static)")
          timeout -k 5s 20s bwrap --unshare-all --die-with-parent --new-session \
            --clearenv --ro-bind "$scratch" / --ro-bind "$qemu" /qemu \
            --dev /dev --proc /proc --chdir / /qemu --version
          echo "FULL_SANDBOX_PREFLIGHT_PASS"
      - name: Install exact NDK release without sdkmanager
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/android-ndk-r27c-linux.zip"
          curl --fail --location --retry 3 --connect-timeout 30 --max-time 600 \
            https://dl.google.com/android/repository/android-ndk-r27c-linux.zip -o "$archive"
          printf '%s  %s\n' 090e8083a715fdb1a3e402d0763c388abb03fb4e "$archive" | sha1sum --check -
          unzip -q "$archive" -d "$RUNNER_TEMP"
          rm -f "$archive"
          test -x "$RUNNER_TEMP/android-ndk-r27c/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi28-clang"
      - name: Fetch Debian ARM EABI glibc 2.24 reference (not a Tizen donor)
        if: github.ref_name == 'development/r800-integration-20261127'
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          ref="$RUNNER_TEMP/r800-debian-glibc-reference"
          mkdir "$ref"
          export REF_DIR="$ref"
          python3 - <<'PY'
          import hashlib, json, lzma, os, pathlib, subprocess, tarfile
          root = pathlib.Path(os.environ["REF_DIR"])
          base = "https://archive.debian.org/debian/"
          def fetch(path, dest):
              subprocess.run(["curl", "--fail", "--location", "--retry", "3",
                              "--max-time", "180", base + path, "-o", str(dest)], check=True)
          index = root / "Packages.xz"
          fetch("dists/stretch/main/binary-armel/Packages.xz", index)
          rows = []
          with lzma.open(index, "rt", encoding="utf-8") as stream:
              for stanza in stream.read().split("\n\n"):
                  fields = dict(line.split(": ", 1) for line in stanza.splitlines()
                                if ": " in line and not line.startswith(" "))
                  if (fields.get("Package"), fields.get("Version"), fields.get("Architecture")) == (
                          "libc6", "2.24-11+deb9u4", "armel"):
                      rows.append(fields)
          assert len(rows) == 1, len(rows)
          row = rows[0]
          name = "pool/main/g/glibc/libc6_2.24-11+deb9u4_armel.deb"
          assert row["Filename"] == name
          archive = root / "reference.deb"
          fetch(name, archive)
          data = archive.read_bytes()
          assert len(data) == int(row["Size"]) and len(data) < 16 * 1024**2
          sha = hashlib.sha256(data).hexdigest()
          assert sha == row["SHA256"]
          # Pin the observed reference archive as well as the repository metadata.
          assert sha == "601950cfcf0e9f705d9a2bff65351dd6e86759cb6573d5ca6ba6cbe98ffaf5d8"
          names = {"libc-2.24.so": "libc.so.6", "libdl-2.24.so": "libdl.so.2",
                   "libpthread-2.24.so": "libpthread.so.0", "ld-2.24.so": "ld-linux.so.3"}
          libs = root / "libs"
          libs.mkdir()
          found = {}
          with subprocess.Popen(["dpkg-deb", "--fsys-tarfile", str(archive)], stdout=subprocess.PIPE) as proc:
              with tarfile.open(fileobj=proc.stdout, mode="r|*") as tar:
                  for member in tar:
                      path = pathlib.PurePosixPath(member.name)
                      if path.parent.as_posix() != "lib/arm-linux-gnueabi" or path.name not in names:
                          continue
                      dest = names[path.name]
                      assert dest not in found and member.isfile() and 0 < member.size <= 64 * 1024**2
                      raw = tar.extractfile(member).read()
                      assert len(raw) == member.size
                      (libs / dest).write_bytes(raw)
                      found[dest] = hashlib.sha256(raw).hexdigest()
              assert proc.wait() == 0
          assert set(found) == set(names.values()), found
          report = {"scope": "DEBIAN_ARMEL_REFERENCE_NOT_TIZEN",
                    "source_sha": os.environ["GITHUB_SHA"], "archive_sha256": sha,
                    "index_sha256": hashlib.sha256(index.read_bytes()).hexdigest(),
                    "index_signature_verified": False, "files": found,
                    "tizen_donor_verified": False, "runtime_verified": False, "safe_to_flash": False}
          (root / "reference-origin.json").write_text(json.dumps(report, indent=2, sort_keys=True))
          PY
      - name: Validate reference donor before isolated tests
        run: |
          set -eu
          ref="$RUNNER_TEMP/r800-debian-glibc-reference"
          python3 build/r800_gps_link_gate.py --donor-only --libdir "$ref/libs" > "$ref/reference-prelink.json" || {
            cat "$ref/reference-prelink.json"; exit 2;
          }
      - name: Isolated Debian ARM glibc reference probe
        if: github.ref_name == 'development/r800-integration-20261127'
        run: |
          set -euo pipefail
          ref="$RUNNER_TEMP/r800-debian-glibc-reference"
          sh build/r800_gps_glibc_qemu.sh "$RUNNER_TEMP/android-ndk-r27c" "$ref/libs" 2>&1 | tee "$ref/reference-qemu-glibc.log"
          grep -Fx 'QEMU_USER_ONLY=PASS' "$ref/reference-qemu-glibc.log"
          echo "DEBIAN_REFERENCE_QEMU_PROBE_PASS; tizen_donor_verified=false; gnss_runtime_verified=false; safe_to_flash=false"
      - name: Isolated synthetic GPS HAL and daemon recovery against Debian reference
        if: github.ref_name == 'development/r800-integration-20261127'
        run: |
          set -euo pipefail
          ref="$RUNNER_TEMP/r800-debian-glibc-reference"
          sh build/r800_gps_mock_qemu.sh "$RUNNER_TEMP/android-ndk-r27c" "$ref/libs" 2>&1 | tee "$ref/reference-qemu-mock.log"
          grep -Fx 'QEMU_SYNTHETIC_GPS_HAL=PASS' "$ref/reference-qemu-mock.log"
          grep -Fx 'QEMU_SYNTHETIC_GPS_DAEMON_RECOVERY=PASS' "$ref/reference-qemu-mock.log"
      - name: Isolated synthetic XTRA matrix against Debian reference
        if: github.ref_name == 'development/r800-integration-20261127'
        run: |
          set -euo pipefail
          ref="$RUNNER_TEMP/r800-debian-glibc-reference"
          sh build/r800_gps_mock_xtra_qemu.sh "$RUNNER_TEMP/android-ndk-r27c" "$ref/libs" 2>&1 | tee "$ref/reference-qemu-xtra.log"
          grep -Fx 'QEMU_SYNTHETIC_XTRA_MATRIX=PASS' "$ref/reference-qemu-xtra.log"
      - name: Compare two independent real GPSBridge links for each reference XTRA ABI
        if: github.ref_name == 'development/r800-integration-20261127'
        run: |
          set -eu
          ref="$RUNNER_TEMP/r800-debian-glibc-reference"
          for abi in 0 1 2; do
            R800_TIZEN_ARCHIVE='' R800_HOST_SNAPSHOT=0 python3 build/r800_gps_repeatability.py \
              --ndk "$RUNNER_TEMP/android-ndk-r27c" --donor "$ref/libs" --xtra-abi "$abi" \
              > "$ref/reference-repeatability-$abi.json" || {
                cat "$ref/reference-repeatability-$abi.json"; exit 2;
              }
          done
          python3 - <<'PY'
          import json, os, pathlib
          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "r800-debian-glibc-reference"
          origin = json.loads((root / "reference-origin.json").read_text())
          hashes = {}
          for abi in (0, 1, 2):
              report = json.loads((root / f"reference-repeatability-{abi}.json").read_text())
              assert report["status"] == "LOCAL_REPEATABILITY_PASS"
              assert report["xtra_abi"] == abi and report["differences"] == []
              assert len(report["runs"]) == 2 and report["runs"][0] == report["runs"][1]
              for flag in ("independent_hosts_tested", "runtime_verified", "safe_to_flash"):
                  assert report[flag] is False
              record = report["runs"][0]
              assert record["donor_sha256"] == origin["files"]
              hashes[str(abi)] = record["binary_sha256"]
          assert len(set(hashes.values())) == 3, "Distinct XTRA ABI binaries must not be conflated"
          summary = {"status": "DEBIAN_REFERENCE_SAME_HOST_REPEATABILITY_PASS",
                     "source_sha": os.environ["GITHUB_SHA"], "binary_sha256_by_abi": hashes,
                     "builds_compared": 6, "tizen_donor_verified": False,
                     "independent_hosts_tested": False, "runtime_verified": False, "safe_to_flash": False}
          (root / "reference-repeatability-summary.json").write_text(json.dumps(summary, indent=2, sort_keys=True))
          print(summary["status"], hashes)
          PY
      - name: Upload isolated reference evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r800-debian-glibc-qemu-reference-evidence
          path: |
            ${{ runner.temp }}/r800-debian-glibc-reference/reference-origin.json
            ${{ runner.temp }}/r800-debian-glibc-reference/reference-prelink.json
            ${{ runner.temp }}/r800-debian-glibc-reference/reference-qemu-glibc.log
            ${{ runner.temp }}/r800-debian-glibc-reference/reference-qemu-mock.log
            ${{ runner.temp }}/r800-debian-glibc-reference/reference-qemu-xtra.log
            ${{ runner.temp }}/r800-debian-glibc-reference/reference-repeatability-*.json
          if-no-files-found: warn
          retention-days: 7
  reference-cross-host:
    if: github.ref_name == 'development/r800-integration-20261127'
    needs: [hal-compile, qemu-reference]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: r800-debian-glibc-reference-evidence
          path: ${{ runner.temp }}/reference-24
      - uses: actions/download-artifact@v4
        with:
          name: r800-debian-glibc-qemu-reference-evidence
          path: ${{ runner.temp }}/reference-22
      - name: Compare exact-head reference reports across independent runners
        run: |
          set -eu
          python3 - <<'PY'
          import json, os, pathlib, re
          root = pathlib.Path(os.environ["RUNNER_TEMP"])
          expected_sha = os.environ["GITHUB_SHA"]
          def load(label):
              directory = root / label
              origin = json.loads((directory / "reference-origin.json").read_text())
              summary = json.loads((directory / "reference-repeatability-summary.json").read_text())
              assert origin["source_sha"] == summary["source_sha"] == expected_sha
              assert origin["scope"] == "DEBIAN_ARMEL_REFERENCE_NOT_TIZEN"
              assert origin["archive_sha256"] == "601950cfcf0e9f705d9a2bff65351dd6e86759cb6573d5ca6ba6cbe98ffaf5d8"
              assert set(origin["files"]) == {"libc.so.6", "libdl.so.2", "libpthread.so.0", "ld-linux.so.3"}
              assert all(re.fullmatch(r"[a-f0-9]{64}", digest) for digest in origin["files"].values())
              assert summary["status"] == "DEBIAN_REFERENCE_SAME_HOST_REPEATABILITY_PASS"
              assert summary["builds_compared"] == 6
              for report in (origin, summary):
                  for flag in ("tizen_donor_verified", "runtime_verified", "safe_to_flash"):
                      assert report[flag] is False
              assert summary["independent_hosts_tested"] is False
              hashes = summary["binary_sha256_by_abi"]
              assert set(hashes) == {"0", "1", "2"} and len(set(hashes.values())) == 3
              for abi in (0, 1, 2):
                  report = json.loads((directory / f"reference-repeatability-{abi}.json").read_text())
                  assert report["status"] == "LOCAL_REPEATABILITY_PASS"
                  assert report["xtra_abi"] == abi and report["differences"] == []
                  assert len(report["runs"]) == 2 and report["runs"][0] == report["runs"][1]
                  assert report["safe_to_flash"] is False and report["runtime_verified"] is False
                  assert report["independent_hosts_tested"] is False
                  record = report["runs"][0]
                  assert record["donor_sha256"] == origin["files"]
                  assert record["binary_sha256"] == hashes[str(abi)]
                  assert re.fullmatch(r"[a-f0-9]{64}", record["binary_sha256"])
              return origin["files"], hashes
          donor24, hashes24 = load("reference-24")
          donor22, hashes22 = load("reference-22")
          assert donor24 == donor22
          differences = [abi for abi in hashes24 if hashes24[abi] != hashes22[abi]]
          report = {"status": "DEBIAN_REFERENCE_CROSS_HOST_MATCH" if not differences else "REVIEW_REQUIRED",
                    "source_sha": expected_sha, "run_id": os.environ["GITHUB_RUN_ID"],
                    "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
                    "runner_labels": ["ubuntu-24.04", "ubuntu-22.04"], "builds_compared": 12,
                    "donor_sha256": donor24, "ubuntu_24_binary_sha256": hashes24,
                    "ubuntu_22_binary_sha256": hashes22, "different_abis": differences,
                    "tizen_donor_verified": False, "runtime_verified": False, "safe_to_flash": False}
          (root / "reference-cross-host.json").write_text(json.dumps(report, indent=2, sort_keys=True))
          print(json.dumps(report, sort_keys=True))
          assert not differences
          PY
      - name: Upload comparison report only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r800-reference-cross-host-evidence
          path: ${{ runner.temp }}/reference-cross-host.json
          if-no-files-found: warn
          retention-days: 7
  kernel:
    if: github.event_name == 'workflow_dispatch' && inputs.kernel_repeatability
    uses: ./.github/workflows/r800-kernel-repeatability.yml
