name: SM-R800 Wear OS 5.1 factory donor intake (NON-RELEASE)
on:
  push:
    branches:
      - development/r800-integration-20261127
    paths:
      - .github/workflows/r800-wear51-factory-intake.yml
      - build/r800_extract_wear51_factory.py
      - tests/test_r800_extract_wear51_factory.py
      - build/r800_extract_pixel_factory.py
      - build/r800_extract_super.py
      - build/r800_partition_identity.py
      - build/r800_pixel_runtime_layout.py
      - build/r800_android_linker_audit.py
      - build/r800_wear51_apex_runtime.py
      - build/r800_wear51_apex_container.py
      - build/r800_wear51_art_dependencies.py
      - build/r800_wear51_art_probe.py
      - build/r800_wear51_qemu_comparator.sh
      - build/r800_wear51_art_boot_probe.py
      - tests/test_r800_wear51_art_boot_probe.py
      - tests/test_r800_wear51_art_probe.py
      - tests/test_r800_wear51_art_dependencies.py
      - tests/test_r800_wear51_apex_container.py
      - build/r800_wear51_startup_diagnostics.py
      - build/r800_art_apex_mapping.py
      - build/r800_apex_inventory.py
      - build/r800_arm32_runtime_extract.py
      - build/r800_hal_compile_smoke.sh
      - build/r800_hal_dlopen_probe.py
      - build/r800_pixel_hal_fixture_summary.py
      - 'src/hal/**'
      - tests/test_r800_wear51_tls.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  factory-intake:
    if: github.repository == 'vorlocsev/galwear' && github.ref_name == 'development/r800-integration-20261127'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate exact build archive selection
        run: python3 -m unittest discover -s tests -p 'test_r800_extract_wear51_factory.py' -v
      - name: Verify pure TBSS validation before inspecting original libraries
        run: python3 -m unittest discover -s tests -p 'test_r800_wear51_tls.py' -v
      - name: Verify isolated QEMU host prerequisites before donor download
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get -o Dir::Etc::sourcelist=/etc/apt/sources.list -o Dir::Etc::sourceparts=- -o Acquire::Retries=3 update
          sudo apt-get -o Dir::Etc::sourcelist=/etc/apt/sources.list -o Dir::Etc::sourceparts=- -o Acquire::Retries=3 install -y --no-install-recommends qemu-user-static bubblewrap android-sdk-libsparse-utils e2fsprogs
          qemu-arm-static --version
          bwrap --version
          scratch=$(mktemp -d "$RUNNER_TEMP/wear51-qemu-preflight.XXXXXX")
          trap 'rm -rf -- "$scratch"' EXIT
          mkdir "$scratch/dev" "$scratch/proc"
          touch "$scratch/qemu"
          qemu=$(realpath "$(command -v qemu-arm-static)")
          timeout -k 5s 20s bwrap --unshare-all --die-with-parent --new-session \
            --clearenv --ro-bind "$scratch" / --ro-bind "$qemu" /qemu \
            --dev /dev --proc /proc --chdir / /qemu --version
          echo WEAR51_QEMU_ISOLATION_PREFLIGHT_PASS
      - name: Verify nested APEX wrapper parsing
        run: python3 -m unittest discover -s tests -p 'test_r800_wear51_apex_container.py' -v
      - name: Test ART dependency candidate graph
        run: python3 -m unittest discover -s tests -p 'test_r800_wear51_art_dependencies.py' -v
      - name: Test ART startup probe namespace and path validation
        run: python3 -m unittest discover -s tests -p 'test_r800_wear51_art_probe.py' -v
      - name: Verify experimental ART boot image probe
        run: python3 -m unittest discover -s tests -p 'test_r800_wear51_art_boot_probe.py' -v
      - name: Obtain exact October 2025 factory image
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p "$RUNNER_TEMP/wear51-intake" "$RUNNER_TEMP/wear51-evidence"
          root="$RUNNER_TEMP/wear51-intake"
          name=r11btwifi-bw1a.251005.003.w1-factory-29f1da6f.zip
          pin=29f1da6fde448bd093160ed0cae0cc431b6647149f136b7bfbcd7fa0afe418e4
          for base in https://dl.google.com/dl/android/aosp https://googledownloads.cn/dl/android/aosp; do
            rm -f "$root/factory.part"
            if curl --fail --location --proto '=https' --proto-redir '=https' --connect-timeout 20 --max-time 600 --retry 1 --max-filesize 8589934592 "$base/$name" -o "$root/factory.part" &&
              printf '%s  %s\n' "$pin" "$root/factory.part" | sha256sum -c -; then
              mv "$root/factory.part" "$root/factory.zip"
              echo "WEAR51_FACTORY_SHA256_MATCH $pin"
              break
            fi
          done
          test -s "$root/factory.zip"
          python3 build/r800_extract_wear51_factory.py --archive "$root/factory.zip" --output "$root/extracted"
          cp "$root/extracted/factory-evidence.json" "$RUNNER_TEMP/wear51-evidence/"
          rm -f "$root/factory.zip"
      - name: Prepare signed-repository QEMU comparator without host installation
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/wear51-intake"
          bash -n build/r800_wear51_qemu_comparator.sh
          bash build/r800_wear51_qemu_comparator.sh "$root"
          cp "$root/qemu-noble/comparator.json" "$RUNNER_TEMP/wear51-evidence/qemu-comparator.json"
      - name: Observe actual Android 15 partition layout and identity
        shell: bash
        run: |
          set -euo pipefail
          command -v debugfs
          command -v readelf
          PYTHONPATH=build python3 - <<'PY'
          import json, os
          from pathlib import Path
          from r800_extract_wear51_factory import FACTORY_SHA256
          from r800_extract_super import normalize, extract
          from r800_super_inventory import inventory
          from r800_partition_identity import inspect_partition
          from r800_pixel_runtime_layout import audit
          from r800_graphics_donor_binding import checkout_sha
          root=Path(os.environ["RUNNER_TEMP"])/"wear51-intake"
          evidence=root.parent/"wear51-evidence"
          source=os.environ["GITHUB_SHA"]
          checkout_sha(source)
          factory=json.loads((evidence/"factory-evidence.json").read_text())
          assert factory["factory_sha256"]==FACTORY_SHA256
          images=factory["images"]
          report={"schema":"galwear-r800-wear51-partitions-v1","source_sha":source,
                  "factory_sha256":FACTORY_SHA256,"partitions":{},
                  "status":"WEAR51_SELECTED_PARTITION_OBSERVATIONS_ONLY",
                  "hardware_tested":False,"safe_to_flash":False}
          def inspect_one(name,path,pin):
              identity=inspect_partition(path,pin,name,source)
              report["partitions"][name]=identity
              if name in ("system","system_a","system_b") and identity["filesystem"]["kind"]=="EXT4":
                  runtime=audit(path,pin,source)
                  (evidence/"runtime-layout.json").write_text(json.dumps(runtime,indent=2,sort_keys=True)+"\n")
                  print("WEAR51_RUNTIME_MEMBERS",json.dumps(runtime["members"],sort_keys=True))
                  print("WEAR51_RUNTIME_DIRECTORIES",json.dumps({p:{"status":v["status"],"names":sorted(v["entries"]),"reason":v.get("reason")} for p,v in runtime["directories"].items()},sort_keys=True))
                  print("WEAR51_RUNTIME_MODULES",json.dumps(runtime["module_candidates"],sort_keys=True))
                  # Compare rejected TLS layouts with independent host readelf.
                  # Only metadata; no guest execution or relaxation of the validator.
                  import hashlib, shutil, tempfile, subprocess, re
                  from r800_extract_ext4 import snapshot_image
                  from r800_framework_inventory import ext4_member, MAX_MEMBER
                  from r800_donor_preflight import digest
                  diagnostics={}
                  with tempfile.TemporaryDirectory(dir=root) as tmp:
                      scratch=Path(tmp)
                      private=scratch/"system.img"
                      snapshot_image(path,private,pin)
                      tool=shutil.which("debugfs")
                      readelf=shutil.which("readelf")
                      assert tool and readelf
                      for member in ("/system/lib/libc++.so","/system/lib/libhidlbase.so","/system/lib/libutils.so"):
                          raw=ext4_member(tool,private,member,MAX_MEMBER,scratch)
                          if raw is None:
                              diagnostics[member]={"status":"NOT_FOUND"}
                              continue
                          target=scratch/"elf"
                          target.write_bytes(raw)
                          try:
                              proc=subprocess.run([readelf,"-W","-h","-l","-d",str(target)],capture_output=True,text=True,timeout=30,check=True)
                              lines=proc.stdout.splitlines()
                              diagnostics[member]={"status":"INDEPENDENT_ELF_HEADER_OBSERVATION_ONLY",
                                  "sha256":hashlib.sha256(raw).hexdigest(),
                                  "strict_observation":runtime["members"].get(member),
                                  "program_headers":[line.strip() for line in lines if re.match(r"\s+(?:LOAD|TLS|GNU_RELRO|DYNAMIC)\s",line)],
                                  "dynamic_needed":[line.strip() for line in lines if "(NEEDED)" in line],
                                  "stderr":proc.stderr[:2048]}
                          finally:
                              target.unlink()
                      assert digest(private,4*1024**3)["sha256"]==digest(path,4*1024**3)["sha256"]==pin
                  (evidence/"elf-tls-diagnostics.json").write_text(json.dumps({"source_sha":source,"image_sha256":pin,"members":diagnostics,"safe_to_flash":False},indent=2,sort_keys=True)+"\n")
                  print("WEAR51_ELF_TLS_DIAGNOSTICS",json.dumps(diagnostics,sort_keys=True))
                  assert len(diagnostics)==3
                  assert all(runtime["members"].get(member,{}).get("status")=="OBSERVED" and
                             runtime["members"][member].get("abi")=="arm" and
                             runtime["members"][member].get("sha256")==row.get("sha256")
                             for member,row in diagnostics.items()), "Original Android 15 ELF TLS revalidation failed"
                  print("WEAR51_ORIGINAL_TLS_STATIC_PASS")
                  from r800_wear51_apex_runtime import audit as apex_audit
                  result=apex_audit(path,pin,source,root/"wear51-bionic",probe_art=True,qemu_compare=root/"qemu-noble")
                  (evidence/"apex-runtime.json").write_text(json.dumps(result,indent=2,sort_keys=True)+"\n")
                  graph=result["art_dependencies"]
                  startup=result["art_startup"]
                  (evidence/"art-startup.json").write_text(json.dumps(startup,indent=2,sort_keys=True)+"\n")
                  print("WEAR51_ART_STARTUP",json.dumps({k:v for k,v in startup.items() if k not in ("staged_sha256","results","synthetic_config","boot_image_probe")},sort_keys=True))
                  boot=startup.get("boot_image_probe",{"status":"NOT_TESTED"})
                  (evidence/"art-boot-probe.json").write_text(json.dumps(boot,indent=2,sort_keys=True)+"\n")
                  print("WEAR51_ART_BOOT_PROBE",json.dumps({k:v for k,v in boot.items() if k not in ("boot_jars","result","comparison")},sort_keys=True))
                  if "boot_jars" in boot:
                      print("WEAR51_ART_BOOT_JARS",json.dumps({k:{"status":v["status"],"sha256":v.get("sha256"),"dex_entries":v.get("dex_entries")} for k,v in boot["boot_jars"]["members"].items()},sort_keys=True))
                  if "result" in boot:
                      case=boot["result"]
                      print("WEAR51_ART_BOOT_CASE",json.dumps({k:v for k,v in case.items() if k!="logdw_records"},sort_keys=True))
                      for record in case.get("logdw_records",[])[:32]:
                          print("WEAR51_ART_BOOT_LOGDW",json.dumps(record,sort_keys=True))
                  if "comparison" in boot:
                      comparison=boot["comparison"]
                      print("WEAR51_ART_QEMU_COMPARISON",json.dumps({k:v for k,v in comparison.items() if k not in ("result","linker_control","speed_experiment")},sort_keys=True))
                      for name in ("linker_control","result"):
                          if name in comparison:
                              case=comparison[name]
                              print("WEAR51_ART_QEMU_COMPARISON_CASE",json.dumps({"case":name,**{k:v for k,v in case.items() if k!="logdw_records"}},sort_keys=True))
                              for record in case.get("logdw_records",[])[:32]:
                                  print("WEAR51_ART_QEMU_COMPARISON_LOGDW",json.dumps({"case":name,**record},sort_keys=True))
                      if "speed_experiment" in comparison:
                          speed=comparison["speed_experiment"]
                          print("WEAR51_ART_SPEED",json.dumps({k:v for k,v in speed.items() if k!="result"},sort_keys=True))
                          case=speed["result"]
                          print("WEAR51_ART_SPEED_CASE",json.dumps({k:v for k,v in case.items() if k!="logdw_records"},sort_keys=True))
                          for record in case.get("logdw_records",[])[:32]:
                              print("WEAR51_ART_SPEED_LOGDW",json.dumps(record,sort_keys=True))
                  for name,case in startup.get("results",{}).items():
                      print("WEAR51_ART_STARTUP_CASE",json.dumps({"case":name,**{k:v for k,v in case.items() if k!="logdw_records"}},sort_keys=True))
                      for record in case.get("logdw_records",[])[:32]:
                          print("WEAR51_ART_LOGDW",json.dumps({"case":name,**record},sort_keys=True))
                  print("WEAR51_APEX_RUNTIME",json.dumps({k:v for k,v in result.items() if k not in ("art_dependencies","art_startup")},sort_keys=True))
                  print("WEAR51_ART_DEPENDENCIES",json.dumps({k:v for k,v in graph.items() if k not in ("objects","edges")},sort_keys=True))
                  if graph["status"]=="SELECTED_ART_DEPENDENCY_CANDIDATES_ONLY":
                      for edge in graph["edges"]:
                          if edge.get("kind")=="OBSERVED_DLOPEN":
                              print("WEAR51_ART_OBSERVED_DLOPEN",json.dumps(edge,sort_keys=True))
                          if edge["status"]!="SINGLE_STATIC_CANDIDATE":
                              print("WEAR51_ART_DEPENDENCY_REVIEW",json.dumps(edge,sort_keys=True))
                  assert result["status"]=="WEAR51_MINIMAL_ARM32_RUNTIME_STATIC_ONLY", "Minimal Android 15 runtime requires review"
          if "super.img" in images:
              assert "system.img" not in images, "Ambiguous System source"
              raw=root/"super.raw"
              origin=normalize(root/"extracted/super.img",raw,images["super.img"]["sha256"])
              meta=inventory(raw,origin["raw_sha256"],0,source)
              (evidence/"super-inventory.json").write_text(json.dumps(meta,indent=2,sort_keys=True)+"\n")
              raw.unlink()
              names=[n for n in ("system","system_a","vendor","vendor_a","product","product_a","system_ext","system_ext_a")
                     if n in meta["partitions"] and meta["partitions"][n]["bytes"]>0 and not meta["partitions"][n]["disabled"]]
              assert len(set(names)&{"system","system_a"})==1
              result=extract(root/"extracted/super.img",images["super.img"]["sha256"],0,names,root/"logical",source)
              report["super_extraction"]=result
              for name,row in result["partitions"].items():
                  path=root/"logical"/row["file"]
                  inspect_one(name,path,row["sha256"])
                  path.unlink()
          else:
              assert "system.img" in images
              for name in ("system","vendor","product","system_ext","odm"):
                  filename=name+".img"
                  if filename not in images:
                      continue
                  raw=root/(name+".raw")
                  origin=normalize(root/"extracted"/filename,raw,images[filename]["sha256"])
                  inspect_one(name,raw,origin["raw_sha256"])
                  report["partitions"][name]["normalization"]=origin
                  raw.unlink()
          checkout_sha(source)
          (evidence/"partitions.json").write_text(json.dumps(report,indent=2,sort_keys=True)+"\n")
          print("WEAR51_PARTITIONS",json.dumps({n:{"filesystem":v["filesystem"],"image_sha256":v["image_sha256"],"properties":v["properties"]["unique_values"]} for n,v in report["partitions"].items()},sort_keys=True))
          PY
      - name: Compile exact-head ARM32 HALs for Android 15 runtime probe
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/wear51-intake"
          evidence="$RUNNER_TEMP/wear51-evidence"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          archive="$root/android-ndk-r27c-linux.zip"
          curl --fail --location --proto '=https' --proto-redir '=https' --retry 2 --connect-timeout 30 --max-time 600 \
            https://dl.google.com/android/repository/android-ndk-r27c-linux.zip -o "$archive"
          printf '%s  %s\n' 090e8083a715fdb1a3e402d0763c388abb03fb4e "$archive" | sha1sum --check -
          unzip -q "$archive" -d "$root"
          rm -f "$archive"
          git init "$root/tinyalsa"
          git -C "$root/tinyalsa" remote add origin https://github.com/tinyalsa/tinyalsa.git
          git -C "$root/tinyalsa" fetch --depth=1 origin 1c5fb68ced57d838f2b7ecd0c00bc1fefc9ab60d
          git -C "$root/tinyalsa" checkout --detach FETCH_HEAD
          sh build/r800_hal_compile_smoke.sh "$GITHUB_WORKSPACE" "$root/android-ndk-r27c" "$root/tinyalsa" "$root/hal"
          cp "$root/hal/hal-compile.json" "$evidence/hal-compile.json"
          python3 build/r800_hal_dlopen_probe.py compile --ndk "$root/android-ndk-r27c" --hals "$root/hal" --source-sha "$GITHUB_SHA" --output "$root/hal-probe"
      - name: Test five HAL HMI exports with original Wear OS 5.1 Bionic
        id: wear51_hmi
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          root="$RUNNER_TEMP/wear51-intake"
          evidence="$RUNNER_TEMP/wear51-evidence"
          rc=0
          python3 build/r800_hal_dlopen_probe.py run --probe-dir "$root/hal-probe" --hals "$root/hal" \
            --runtime "$root/wear51-bionic" --runtime-manifest "$root/wear51-bionic/runtime-manifest.json" \
            --output "$root/wear51-hal-runtime" --qemu-cpu max || rc=$?
          if test -f "$root/wear51-hal-runtime/hal-runtime-evidence.json"; then
            cp "$root/wear51-hal-runtime/hal-runtime-evidence.json" "$evidence/hal-runtime.json"
          fi
          test "$rc" -eq 0
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          evidence=Path(os.environ["RUNNER_TEMP"])/"wear51-evidence"
          source=os.environ["GITHUB_SHA"]
          runtime=json.loads((evidence/"apex-runtime.json").read_text())
          report=json.loads((evidence/"hal-runtime.json").read_text())
          compiled=json.loads((evidence/"hal-compile.json").read_text())
          assert runtime["source_sha"]==report["source_sha"]==compiled["commit"]==source
          assert runtime["status"]=="WEAR51_MINIMAL_ARM32_RUNTIME_STATIC_ONLY"
          assert report["runtime_sha256"]=={k:v["sha256"] for k,v in runtime["minimal_runtime"]["files"].items()}
          hals={"audio.primary.r800.so","gps.r800.so","hwcomposer.r800.so","lights.r800.so","sensors.r800.so"}
          assert set(report["results"])==set(report["hal_sha256"])==hals
          for name in hals:
              row=compiled["audio_candidate"] if name.startswith("audio.") else compiled["linked_libraries"][name.split(".")[0]]
              assert report["hal_sha256"][name]==row["sha256"]
          assert report["status"]=="ARM32_HAL_HMI_QEMU_USER_ONLY"
          assert report["qemu_cpu"]=="max" and report["cpu_hardware_compatibility_verified"] is False
          assert all(v["status"]=="HMI_ONLY_PASS" and v["exit_code"]==0 for v in report["results"].values())
          assert report["hal_open_called"] is False and report["hardware_tested"] is False and report["safe_to_flash"] is False
          print("WEAR51_ORIGINAL_BIONIC_HAL_HMI_PASS",json.dumps({"source_sha":source,"system_sha256":runtime["system_sha256"],"modules":sorted(hals),"safe_to_flash":False},sort_keys=True))
          PY
      - name: Exercise all ten synthetic HAL scenarios with original Android 15 Bionic
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/wear51-intake"
          evidence="$RUNNER_TEMP/wear51-evidence"
          failed=0
          for mode in lifecycle lights-fixture sensors-fixture sensors-context sensors-evdev gps-fixture audio-fixture audio-pcm-fixture hwc-fixture namespace-fixture; do
            rc=0
            python3 build/r800_hal_dlopen_probe.py run --probe-dir "$root/hal-probe" --hals "$root/hal" \
              --runtime "$root/wear51-bionic" --runtime-manifest "$root/wear51-bionic/runtime-manifest.json" \
              --output "$root/wear51-hal-$mode" --qemu-cpu max "--$mode" || rc=$?
            if test -f "$root/wear51-hal-$mode/hal-runtime-evidence.json"; then
              cp "$root/wear51-hal-$mode/hal-runtime-evidence.json" "$evidence/hal-$mode.json"
            fi
            if test "$rc" -ne 0; then failed=1; fi
          done
          PYTHONPATH=build python3 - <<'PY'
          import json, os, hashlib
          from pathlib import Path
          from r800_pixel_hal_fixture_summary import MODES, probe_valid
          from r800_wear51_apex_runtime import SYSTEM_PIN
          evidence=Path(os.environ["RUNNER_TEMP"])/"wear51-evidence"
          source=os.environ["GITHUB_SHA"]
          runtime=json.loads((evidence/"apex-runtime.json").read_text())
          baseline=json.loads((evidence/"hal-runtime.json").read_text())
          assert runtime["source_sha"]==baseline["source_sha"]==source
          assert runtime["system_sha256"]==SYSTEM_PIN
          assert baseline["qemu_cpu"]=="max" and baseline["cpu_hardware_compatibility_verified"] is False
          pins={k:v["sha256"] for k,v in runtime["minimal_runtime"]["files"].items()}
          hals=baseline["hal_sha256"]
          assert pins==baseline["runtime_sha256"]
          rows={}
          for mode,(status,marker,modules) in MODES.items():
              path=evidence/("hal-"+mode+".json")
              if not path.is_file():
                  rows[mode]={"status":"NOT_TESTED"}
                  continue
              raw=path.read_bytes()
              assert 0<len(raw)<=1024*1024
              report=json.loads(raw)
              passed=(probe_valid(report,source,pins,hals,status,marker,modules)
                      and report.get("qemu_cpu")=="max"
                      and report.get("cpu_hardware_compatibility_verified") is False)
              rows[mode]={"status":"PASS" if passed else "REVIEW_REQUIRED",
                          "report_sha256":hashlib.sha256(raw).hexdigest(),
                          "probe_status":report.get("status"),"modules":sorted(report.get("results",{}))}
          passed=all(v["status"]=="PASS" for v in rows.values())
          summary={"schema":"galwear-r800-wear51-hal-fixtures-v1","source_sha":source,
                   "system_sha256":SYSTEM_PIN,"runtime_sha256":pins,"hal_sha256":hals,
                   "qemu_cpu":"max","modes":rows,
                   "status":"WEAR51_HAL_SYNTHETIC_FIXTURES_ONLY" if passed else "REVIEW_REQUIRED",
                   "cpu_hardware_compatibility_verified":False,"android_boot_tested":False,
                   "hardware_tested":False,"safe_to_flash":False}
          (evidence/"hal-fixtures-summary.json").write_text(json.dumps(summary,indent=2,sort_keys=True)+"\n")
          print("WEAR51_HAL_FIXTURE_SUMMARY",json.dumps(summary,sort_keys=True))
          if not passed:
              raise SystemExit(2)
          PY
          test "$failed" -eq 0
      - name: Diagnose failed Android 15 startup without changing acceptance
        if: failure() && steps.wear51_hmi.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/wear51-intake"
          evidence="$RUNNER_TEMP/wear51-evidence"
          python3 build/r800_wear51_startup_diagnostics.py --root "$root" --evidence "$evidence" \
            --source-sha "$GITHUB_SHA" --output "$evidence/startup-diagnostics.json"
      - name: Check experimental ART startup result separately from HAL gates
        if: always()
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"wear51-evidence/art-startup.json"
          assert p.is_file(), "ART startup not tested"
          r=json.loads(p.read_text())
          assert r["status"]=="DEX2OAT_ARGUMENT_HANDLER_PROBE_ONLY", r.get("reason","ART argument-handler probe requires review")
          assert r["results"]["linker-list"]["status"]=="MARKER_PASS"
          for name in ("dex2oat-help","dex2oat-noargs","dex2oat-invalid"):
              assert r["results"][name]["status"]=="ARGUMENT_HANDLER_OBSERVED"
          assert r["dex_compilation_verified"] is False
          assert r["source_sha"]==os.environ["GITHUB_SHA"] and r["qemu_cpu"]=="max"
          assert r["art_initialized"] is False and r["safe_to_flash"] is False
          PY
      - name: Require QEMU 8.2 original ART verify boot output independently of speed experiment
        if: always()
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          evidence=Path(os.environ["RUNNER_TEMP"])/"wear51-evidence"
          startup=json.loads((evidence/"art-startup.json").read_text())
          boot=json.loads((evidence/"art-boot-probe.json").read_text())
          provenance=json.loads((evidence/"qemu-comparator.json").read_text())
          assert startup["source_sha"]==os.environ["GITHUB_SHA"]
          assert startup["boot_image_probe"]==boot
          comparison=boot["comparison"]
          assert comparison["qemu"]==provenance
          assert comparison["linker_control"]["status"]=="MARKER_PASS"
          assert comparison["status"]=="BOOT_OUTPUT_HEADERS_OBSERVED"
          result=comparison["result"]
          assert result["exit_code"]==0 and not result["timeout"] and not result["output_capped"]
          assert set(result["output_headers"])=={"boot.art","boot.oat","boot.vdex"}
          assert all(v["status"]=="HEADER_OBSERVED" for v in result["output_headers"].values())
          assert startup["safe_to_flash"] is False
          print("WEAR51_ART_VERIFY_BOOT_OUTPUT_PASS")
          PY
      - name: Remove original and extracted binary images
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/wear51-intake"
      - name: Upload JSON evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wear51-factory-evidence-only
          path: |
            ${{ runner.temp }}/wear51-evidence/factory-evidence.json
            ${{ runner.temp }}/wear51-evidence/super-inventory.json
