            ${{ runner.temp }}/wear51-evidence/elf-tls-diagnostics.json
            ${{ runner.temp }}/wear51-evidence/apex-runtime.json
            ${{ runner.temp }}/wear51-evidence/art-startup.json
            ${{ runner.temp }}/wear51-evidence/art-boot-probe.json
            ${{ runner.temp }}/wear51-evidence/qemu-comparator.json
            ${{ runner.temp }}/wear51-evidence/hal-compile.json
            ${{ runner.temp }}/wear51-evidence/hal-runtime.json
            ${{ runner.temp }}/wear51-evidence/hal-lifecycle.json
            ${{ runner.temp }}/wear51-evidence/hal-lights-fixture.json
            ${{ runner.temp }}/wear51-evidence/hal-sensors-fixture.json
