name: SM-R800 Pixel Watch factory donor intake (NON-RELEASE)
on:
  push:
    branches:
      - development/r800-integration-20261127
    paths:
      - .github/workflows/r800-pixel-factory-intake.yml
      - build/r800_extract_pixel_factory.py
      - build/r800_extract_super.py
      - build/r800_super_inventory.py
      - build/r800_partition_identity.py
      - build/r800_dex_hiddenapi_observation.py
      - tests/test_r800_dex_hiddenapi_observation.py
      - build/r800_bind_pixel_system.py
      - tests/test_r800_partition_identity.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  factory-intake:
    if: github.repository == 'vorlocsev/galwear' && github.ref_name == 'development/r800-integration-20261127'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Obtain exact Android 11 Bluetooth/Wi-Fi factory archive
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p "$RUNNER_TEMP/pixel-intake" "$RUNNER_TEMP/pixel-evidence"
          pin=eb4977308b8fe6a25bbe0c4918d95e6e79b9f05ae608f48ac2f04b65c42f0b52
          archive="$RUNNER_TEMP/pixel-intake/factory.zip"
          name=r11btwifi-rwdc.230905.003-factory-eb497730.zip
          for base in https://dl.google.com/dl/android/aosp https://googledownloads.cn/dl/android/aosp; do
            rm -f "$archive.part"
            if curl --fail --location --proto '=https' --proto-redir '=https' --connect-timeout 15 --max-time 420 --retry 1 --max-filesize 8589934592 "$base/$name" -o "$archive.part" &&
              printf '%s  %s\n' "$pin" "$archive.part" | sha256sum -c -; then
              mv "$archive.part" "$archive"
              echo "FACTORY_ARCHIVE_SHA256_MATCH $pin"
              break
            fi
          done
          test -s "$archive"
          python3 build/r800_extract_pixel_factory.py --archive "$archive" --output "$RUNNER_TEMP/pixel-intake/extracted"
          cp "$RUNNER_TEMP/pixel-intake/extracted/pixel-evidence.json" "$RUNNER_TEMP/pixel-evidence/"
      - name: Inspect selected system partition without mounting or execution
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends e2fsprogs
          python3 -m unittest discover -s tests -p 'test_r800_partition_identity.py' -v
          python3 -m unittest discover -s tests -p 'test_r800_dex_hiddenapi_observation.py' -v
          PYTHONPATH=build python3 - <<'PY'
          import json, os, hashlib
          from pathlib import Path
          from r800_extract_super import normalize, extract
          from r800_super_inventory import inventory
          from r800_partition_identity import inspect_partition
          from r800_bind_pixel_system import describe
          from r800_extract_pixel_factory import FACTORY_SHA256
          root=Path(os.environ["RUNNER_TEMP"])/"pixel-intake"
          evidence=root.parent/"pixel-evidence"
          source=os.environ["GITHUB_SHA"]
          extracted=root/"extracted"
          factory=json.loads((extracted/"pixel-evidence.json").read_text())
          assert factory["factory_sha256"]==FACTORY_SHA256
          images=factory["images"]
          if "system.img" in images and "super.img" not in images:
              mode,slot,name="direct",None,"system"
              target=root/"system.img"
              origin=normalize(extracted/"system.img",target,images["system.img"]["sha256"])
              row={"file":target.name,"bytes":origin["raw_bytes"],"sha256":origin["raw_sha256"],"provenance":origin}
              sup=None
          elif "super.img" in images and "system.img" not in images:
              mode,slot="super",0
              raw=root/"super-inventory.raw"
              origin=normalize(extracted/"super.img",raw,images["super.img"]["sha256"])
              meta=inventory(raw,origin["raw_sha256"],slot,source)
              (evidence/"super-inventory.json").write_text(json.dumps(meta,indent=2,sort_keys=True))
              raw.unlink()
              names=[n for n in ("system","system_a") if n in meta["partitions"] and meta["partitions"][n]["bytes"]>0 and not meta["partitions"][n]["disabled"]]
              assert len(names)==1, "Explicit slot 0: expected one enabled nonempty system partition"
              name=names[0]
              sup=extract(extracted/"super.img",images["super.img"]["sha256"],slot,[name],root/"logical",source)
              target=root/"logical"/(name+".img")
              row={**sup["partitions"][name],"provenance":{"source":"super.img","metadata_slot":slot,"raw_bytes":sup["partitions"][name]["bytes"],"raw_sha256":sup["partitions"][name]["sha256"]}}
          else:
              raise ValueError("Ambiguous factory system source")
          identity=inspect_partition(target,row["sha256"],name,source)
          row.update(filesystem=identity["filesystem"],identity=identity)
          report={"schema":"galwear-r800-pixel-raw-donor-v1","status":"SELECTED_PIXEL_RAW_DONOR_PARTITIONS_ONLY","source_sha":source,"factory_sha256":FACTORY_SHA256,"documented_factory_pin_matched":True,"factory_extraction":factory,"partitions":{name:row},"mode":mode,"metadata_slot":slot,"super_extraction":sup}
          for flag in ("system_adaptation_verified","donor_authenticity_verified","wear_os_runtime_verified","r800_compatibility_verified","hardware_tested","safe_to_flash"):
              report[flag]=False
          data=(json.dumps(report,indent=2,sort_keys=True)+"\n").encode()
          (evidence/"pixel-raw-donor.json").write_bytes(data)
          binding=describe(report,row["sha256"],hashlib.sha256(data).hexdigest(),source)
          (evidence/"pixel-binding.json").write_text(json.dumps(binding,indent=2,sort_keys=True)+"\n")
          print("PIXEL_FACTORY_SYSTEM_STATIC_ONLY",json.dumps({"partition":name,"bytes":row["bytes"],"sha256":row["sha256"],"filesystem":row["filesystem"]["kind"],"identity_status":identity["status"],"safe_to_flash":False},sort_keys=True))
          PY
      - name: Inspect actual Android framework ELF and JAR candidates
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=build python3 - <<'PY'
          import json, os, hashlib
          from pathlib import Path
          from r800_framework_inventory import audit
          from r800_bind_pixel_system import verify
          root=Path(os.environ["RUNNER_TEMP"])/"pixel-intake"
          evidence=root.parent/"pixel-evidence"
          source=os.environ["GITHUB_SHA"]
          report_path=evidence/"pixel-raw-donor.json"
          raw=report_path.read_bytes()
          report=json.loads(raw)
          assert report["source_sha"]==source
          assert len(report["partitions"])==1
          name,row=next(iter(report["partitions"].items()))
          image=root/row["file"] if report["mode"]=="direct" else root/"logical"/row["file"]
          verify(image,row["sha256"],report_path,hashlib.sha256(raw).hexdigest(),source)
          identity=row["identity"]
          assert identity["status"]=="EXT4_LITERAL_PROPERTIES_ONLY"
          properties=identity["properties"]
          print("PIXEL_LITERAL_PROPERTIES", json.dumps({
              "values":properties["unique_values"],
              "android11_hint":properties["literal_android_11_hint"],
              "arm32_hint":properties["literal_arm32_hint"],
              "watch_hint":properties["literal_watch_hint"]},sort_keys=True))
          members=identity["property_members"]
          prefixes=[prefix for prefix in ("","/system") if prefix+"/build.prop" in members]
          assert prefixes, "No observed system build.prop root"
          requested=["bin/app_process32","bin/app_process64","bin/surfaceflinger",
                     "framework/framework.jar","framework/services.jar","framework/android.test.base.jar",
                     "lib/libandroid_runtime.so","lib64/libandroid_runtime.so","lib/libgui.so",
                     "lib64/libgui.so","etc/permissions/android.hardware.type.watch.xml"]
          reports={}
          for prefix in prefixes:
              result=audit(image,row["sha256"],name,source,prefix,requested,validate_dex=False)
              strict=audit(image,row["sha256"],name,source,prefix,
                           ["framework/framework.jar","framework/services.jar"],validate_dex=True)
              reports[prefix]={"framework":result,"dex":strict}
              summary={p:{k:v for k,v in item.items() if k in
                          ("status","kind","abi","needed","dex_entries","reason")}
                       for p,item in result["members"].items()}
              print("PIXEL_FRAMEWORK_MEMBERS",json.dumps(summary,sort_keys=True))
              print("PIXEL_DEX_REVIEW",json.dumps({p:{k:v for k,v in item.items()
                    if k in ("status","kind","reason","dex_entries")} for p,item in strict["members"].items()},sort_keys=True))
          # Diagnose each DEX independently without relaxing strict validation
          # or modifying original bytes, including ZIP CRC verified by read().
          import io, struct, tempfile, shutil, zipfile, zlib
          from r800_extract_ext4 import snapshot_image
          from r800_framework_inventory import ext4_member
          from r800_art_inventory import DEX_NAME, MAX_JAR, MAX_DEX, MAX_TOTAL, dex_inventory
          from r800_dex_hiddenapi_observation import observe as observe_hiddenapi
          diagnostics={}
          with tempfile.TemporaryDirectory(dir=root) as tmp:
              scratch=Path(tmp)
              private=scratch/"system.img"
              snapshot_image(image,private,row["sha256"])
              tool=shutil.which("debugfs")
              assert tool
              for prefix in prefixes:
                  for filename in ("framework.jar","services.jar"):
                      path=prefix+"/framework/"+filename
                      jar=ext4_member(tool,private,path,MAX_JAR,scratch)
                      if jar is None:
                          continue
                      with zipfile.ZipFile(io.BytesIO(jar)) as z:
                          entries=[e for e in z.infolist() if DEX_NAME.fullmatch(e.filename)]
                          assert len(entries)<=64 and sum(e.file_size for e in entries)<=MAX_TOTAL
                          assert len({e.filename for e in entries})==len(entries)
                          rows={}
                          for e in entries:
                              assert 112<=e.file_size<=MAX_DEX
                              data=z.read(e)
                              item={"bytes":len(data),"sha256":hashlib.sha256(data).hexdigest(),
                                    "header_magic_hex":data[:8].hex(),
                                    "zip_crc32_matches":zlib.crc32(data)&0xffffffff==e.CRC,
                                    "header_sha1_matches":hashlib.sha1(data[32:]).digest()==data[12:32],
                                    "header_adler32_matches":zlib.adler32(data[12:])&0xffffffff==struct.unpack_from("<I",data,8)[0]}
                              try:
                                  dex_inventory(data)
                                  item["status"]="STRICT_HEADER_PASS"
                              except ValueError as exc:
                                  item.update(status="REVIEW_REQUIRED",reason=str(exc))
                              if not item["header_sha1_matches"] and item["header_adler32_matches"]:
                                  try:
                                      item["hiddenapi_observation"]=observe_hiddenapi(data)
                                  except ValueError as exc:
                                      item["hiddenapi_observation"]={"status":"REVIEW_REQUIRED","reason":str(exc)}
                              rows[e.filename]=item
                          diagnostics[path]=rows
          (evidence/"pixel-dex-diagnostics.json").write_text(json.dumps({
              "source_sha":source,"image_sha256":row["sha256"],
              "members":diagnostics,"bytecode_verified":False,
              "safe_to_flash":False},indent=2,sort_keys=True)+"\n")
          print("PIXEL_DEX_MEMBER_DIAGNOSTICS",json.dumps(diagnostics,sort_keys=True))
          (evidence/"pixel-framework-inventory.json").write_text(json.dumps({
              "schema":"galwear-r800-pixel-framework-observation-v1",
              "source_sha":source,"image_sha256":row["sha256"],
              "status":"SELECTED_FRAMEWORK_OBSERVATIONS_ONLY",
              "reports":reports,"bionic_runtime_verified":False,
              "art_initialization_verified":False,"hardware_tested":False,
              "safe_to_flash":False},indent=2,sort_keys=True)+"\n")
          PY
      - name: Inspect original ARM32 Bionic and ART APEX modules
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=build python3 - <<'PY'
          import hashlib, json, os, shutil, tempfile, zipfile, subprocess
          from pathlib import Path
          from r800_extract_ext4 import snapshot_image
          from r800_framework_inventory import ext4_member, classify, MAX_MEMBER
          from r800_art_apex_mapping import ApexReader
          from r800_android_runtime_extract import MAX_APEX
          from r800_donor_preflight import digest
          from r800_graphics_donor_binding import checkout_sha
          root=Path(os.environ["RUNNER_TEMP"])/"pixel-intake"
          evidence=root.parent/"pixel-evidence"
          source=os.environ["GITHUB_SHA"]
          checkout_sha(source)
          report=json.loads((evidence/"pixel-raw-donor.json").read_text())
          assert report["source_sha"]==source
          assert len(report["partitions"])==1
          name,row=next(iter(report["partitions"].items()))
          image=root/row["file"] if report["mode"]=="direct" else root/"logical"/row["file"]
          wanted={
              "com.android.runtime":["/bin/linker","/lib/bionic/libc.so","/lib/bionic/libm.so","/lib/bionic/libdl.so"],
              "com.android.art":["/lib/libart.so","/lib/libartbase.so","/bin/dex2oat","/javalib/core-oj.jar","/javalib/core-libart.jar"],
              "com.android.vndk.v30":["/lib/libhidlbase.so","/lib/libutils.so","/lib/libcutils.so"]}
          modules={}
          with tempfile.TemporaryDirectory(dir=root) as tmp:
              scratch=Path(tmp)
              private=scratch/"system.img"
              snapshot_image(image,private,row["sha256"])
              tool=shutil.which("debugfs")
              assert tool
              prefixes=[p for p in ("","/system") if p+"/build.prop" in row["identity"]["property_members"]]
              assert prefixes
              for module,paths in wanted.items():
                  item={"status":"NOT_FOUND_IN_SELECTED_PATHS","candidates":[],"members":{}}
                  modules[module]=item
                  try:
                      for prefix in prefixes:
                          for filename in (module+".apex",module.replace("com.android.","com.google.android.",1)+".apex"):
                              path=prefix+"/apex/"+filename
                              data=ext4_member(tool,private,path,MAX_APEX,scratch)
                              if data is not None:
                                  item["candidates"].append({"path":path,"bytes":len(data),"sha256":hashlib.sha256(data).hexdigest()})
                              del data
                      if not item["candidates"]:
                          continue
                      if len(item["candidates"])!=1:
                          raise ValueError("Ambiguous selected APEX package")
                      candidate=item["candidates"][0]
                      guest="/system/apex/"+candidate["path"].split("/")[-1]
                      directory=scratch/module
                      directory.mkdir()
                      def read_partition(path,limit):
                          assert path==guest
                          return ext4_member(tool,private,candidate["path"],limit,directory)
                      reader=ApexReader([(module,guest,candidate["sha256"])],read_partition,directory)
                      apex_tool,payload,workspace,*_=reader.open(module)
                      for path in paths:
                          try:
                              raw=ext4_member(apex_tool,payload,path,MAX_MEMBER,workspace)
                              if raw is None:
                                  item["members"][path]={"status":"NOT_FOUND"}
                              else:
                                  item["members"][path]={"status":"OBSERVED",**classify(path,raw)}
                          except (OSError,ValueError,RuntimeError,zipfile.BadZipFile,subprocess.SubprocessError) as exc:
                              item["members"][path]={"status":"REVIEW_REQUIRED","reason":str(exc)}
                      reader.verify_unchanged()
                      item["package"]=reader.evidence[module]
                      item["status"]="SELECTED_APEX_MEMBERS_STATIC_ONLY" if all(m["status"]=="OBSERVED" for m in item["members"].values()) else "REVIEW_REQUIRED"
                  except (OSError,ValueError,RuntimeError,zipfile.BadZipFile,subprocess.SubprocessError) as exc:
                      item.update(status="REVIEW_REQUIRED",reason=str(exc))
              assert digest(private,4*1024**3)["sha256"]==digest(image,4*1024**3)["sha256"]==row["sha256"]
          checkout_sha(source)
          result={"schema":"galwear-r800-pixel-apex-observation-v1","source_sha":source,
                  "image_sha256":row["sha256"],"status":"SELECTED_APEX_OBSERVATIONS_ONLY",
                  "modules":modules,"apex_activation_verified":False,
                  "bionic_runtime_verified":False,"art_initialization_verified":False,
                  "hardware_tested":False,"safe_to_flash":False}
          (evidence/"pixel-apex-observation.json").write_text(json.dumps(result,indent=2,sort_keys=True)+"\n")
          print("PIXEL_APEX_OBSERVATION",json.dumps(modules,sort_keys=True))
          PY
      - name: Remove factory archive and all extracted image bytes
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/pixel-intake"
      - name: Upload selected JSON metadata only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pixel-factory-intake-evidence-only
          path: |
            ${{ runner.temp }}/pixel-evidence/pixel-evidence.json
            ${{ runner.temp }}/pixel-evidence/super-inventory.json
            ${{ runner.temp }}/pixel-evidence/pixel-raw-donor.json
            ${{ runner.temp }}/pixel-evidence/pixel-binding.json
            ${{ runner.temp }}/pixel-evidence/pixel-framework-inventory.json
            ${{ runner.temp }}/pixel-evidence/pixel-dex-diagnostics.json
            ${{ runner.temp }}/pixel-evidence/pixel-apex-observation.json
          if-no-files-found: warn
          retention-days: 7
