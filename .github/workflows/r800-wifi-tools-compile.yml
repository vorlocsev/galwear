name: SM-R800 Wi-Fi tools compile (non-release)

on:
  push:
    branches:
      - "development/r800-android-linker-audit-20261125"
      - "development/r800-integration-20261127"
    paths:
      - "build/r800_build_wifi_tools.sh"
      - ".github/workflows/r800-wifi-tools-compile.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arm32-wifi-tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Confirm exact triggering checkout
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Install cross compiler and build dependencies
        run: |
          set -eu
          test -s /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources \
            -o Dir::Etc::sourceparts=- -o Acquire::Retries=3 update
          sudo apt-get -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources \
            -o Dir::Etc::sourceparts=- -o Acquire::Retries=3 install -y --no-install-recommends \
            gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi libc6-dev-armel-cross qemu-user flex bison pkg-config
      - name: Compile and inspect static ARM32 Wi-Fi tools
        run: |
          sh -n build/r800_build_wifi_tools.sh
          sh build/r800_build_wifi_tools.sh "$RUNNER_TEMP/r800-wifi-tools"
      - name: Upload evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r800-wifi-tools-evidence-only
          path: ${{ runner.temp }}/r800-wifi-tools/evidence/
          if-no-files-found: warn
          retention-days: 7
