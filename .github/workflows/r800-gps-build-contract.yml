name: R800 GPS builder contract (NON-RELEASE)

on:
  push:
    branches:
      - development/r800-integration-20261127
    paths:
      - .github/workflows/r800-gps-build-contract.yml
      - src/tools/gps/**
      - build/r800_gps_*
      - build/r800_tizen_*
      - build/r800_stage_tizen.py
      - build/r800_verify_tizen_stage.py
      - build/r800_pack_tizen_stage.py
      - build/r800_android_userspace_preflight.py
      - build/r800_android_linker_audit.py
      - tests/test_r800_gps_*
      - tests/test_r800_tizen_*
      - tests/r800_glibc_probe*
      - tests/r800_probe_*
      - tests/r800_mock_gps_hal.c
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Record exact checkout and scope
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git log -1 --format='%H'
          echo "HOST-ONLY synthetic contract; safe_to_flash=false"
      - name: Install host compilation tools from signed Ubuntu repositories
        run: |
          set -eu
          test -s /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources \
            -o Dir::Etc::sourceparts=- -o Acquire::Retries=3 update
          sudo apt-get -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources \
            -o Dir::Etc::sourceparts=- -o Acquire::Retries=3 install -y --no-install-recommends clang lld binutils
      - name: Syntax and tooling
        run: |
          set -eu
          for tool in cc clang ld.lld readelf python3; do
            command -v "$tool"
          done
          for script in src/tools/gps/build.sh build/r800_gps_*.sh; do
            sh -n "$script"
          done
          python3 -m py_compile build/r800_gps_*.py tests/test_r800_gps_*.py
      - name: ARM32 glibc probe compile-only smoke
        run: |
          set -eu
          export LC_ALL=C
          sh -n build/r800_gps_glibc_qemu.sh
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          clang --version
          for source in tests/r800_glibc_probe.c tests/r800_glibc_probe_plugin.c; do
            output="$tmp/$(basename "$source").o"
            clang --target=armv7a-linux-gnueabi -mfloat-abi=softfp -mfpu=vfpv3-d16 -O2 --no-default-config -nostdinc -ffreestanding -fno-builtin -fno-stack-protector -Wall -Wextra -Werror -c "$source" -o "$output"
            readelf -h "$output" > "$output.header"
            grep -Eq 'Class:[[:space:]]*ELF32' "$output.header"
            grep -Eq 'Data:.*little endian' "$output.header"
            grep -Eq 'Type:[[:space:]]*REL' "$output.header"
            grep -Eq 'Machine:[[:space:]]*ARM[[:space:]]*$' "$output.header"
            grep -Eq 'Flags:.*Version5 EABI' "$output.header"
          done
          # Explicit positive/negative TLS ABI checks. Neither object is run.
          clang --target=armv7a-linux-gnueabi -marm -mfloat-abi=softfp -mfpu=vfpv3-d16 -mtp=cp15 -ftls-model=local-exec -O2 --no-default-config -nostdinc -ffreestanding -fno-builtin -fno-stack-protector -fno-pic -fno-pie -Wall -Wextra -Werror -c tests/r800_glibc_probe.c -o "$tmp/tls-cp15.o"
          sh build/r800_gps_probe_tls_object.sh readelf "$tmp/tls-cp15.o"
          clang --target=armv7a-linux-gnueabi -marm -mfloat-abi=softfp -mfpu=vfpv3-d16 -mtp=soft -ftls-model=local-exec -O2 --no-default-config -nostdinc -ffreestanding -fno-builtin -fno-stack-protector -fno-pic -fno-pie -Wall -Wextra -Werror -c tests/r800_glibc_probe.c -o "$tmp/tls-soft.o"
          if sh build/r800_gps_probe_tls_object.sh readelf "$tmp/tls-soft.o"; then
            echo "Unexpected acceptance of software thread-pointer helper" >&2
            exit 1
          fi
          # Synthetic link-only providers: every function traps if executed.
          for spec in 'libc.so.6 __libc_start_main puts fflush gnu_get_libc_version strcmp' 'libdl.so.2 dlopen dlsym dlclose' 'libpthread.so.0 pthread_create pthread_join'; do
            set -- $spec
            name=$1
            shift
            : > "$tmp/$name.c"
            for sym in "$@"; do
              printf '%s\n' "__attribute__((noreturn)) void $sym(void) { __asm__ volatile(\"udf #0\"); __builtin_unreachable(); }" >> "$tmp/$name.c"
            done
            printf 'GLIBC_2.4 { global: %s; local: *; };\n' "$(printf '%s; ' "$@" | sed 's/; $//')" > "$tmp/$name.map"
            clang --target=armv7a-linux-gnueabi -marm -mfloat-abi=softfp -mfpu=vfpv3-d16 -nostdlib -ffreestanding -fno-builtin -fPIC -shared -fuse-ld=lld -Wl,--hash-style=sysv,-soname,"$name",--version-script="$tmp/$name.map" -o "$tmp/$name" "$tmp/$name.c"
          done
          clang --target=armv7a-linux-gnueabi -marm -mfloat-abi=softfp -mfpu=vfpv3-d16 --no-default-config -nostdlib -no-pie -fuse-ld=lld -Wl,--hash-style=sysv,-z,noexecstack,-z,now,--no-undefined -Wl,--dynamic-linker=/lib/ld-linux.so.3,-e,_start -o "$tmp/probe" "$tmp/tls-cp15.o" "$tmp/libc.so.6" "$tmp/libdl.so.2" "$tmp/libpthread.so.0"
          python3 build/r800_gps_probe_linked.py "$tmp/probe"
          python3 tests/r800_probe_linked_regressions.py "$tmp/probe" -v
          clang --target=armv7a-linux-gnueabi -marm -mfloat-abi=softfp -mfpu=vfpv3-d16 -O2 --no-default-config -nostdinc -ffreestanding -fno-builtin -fno-stack-protector -fPIC -shared -nostdlib -fuse-ld=lld -Wl,--build-id=none,--hash-style=sysv,-z,noexecstack,--no-undefined -o "$tmp/probe_plugin.so" tests/r800_glibc_probe_plugin.c
          readelf -lW "$tmp/probe_plugin.so"
          python3 build/r800_gps_probe_plugin.py "$tmp/probe_plugin.so"
          python3 tests/r800_probe_plugin_regressions.py "$tmp/probe_plugin.so" -v
          echo "ARM32_SYNTHETIC_LINK_ONLY=PASS"
          echo "ARM32_PROBE_COMPILE_ONLY=PASS"
          echo "QEMU_EXECUTED=false"
          echo "safe_to_flash=false"

      - name: QEMU glibc probe evidence regressions (no guest execution)
        run: |
          python3 -m py_compile build/r800_gps_qemu_evidence.py
          python3 -m unittest discover -s tests -p test_r800_gps_qemu_evidence.py -v

      - name: Consolidated GNSS synthetic host acceptance
        id: acceptance
        run: |
          set -eu
          sh -n build/r800_gps_mock_qemu.sh
          sh -n build/r800_gps_mock_xtra_qemu.sh
          evidence="$RUNNER_TEMP/r800-gnss-evidence"
          mkdir -m 700 "$evidence"
          printf '%s\n' "$GITHUB_SHA" > "$evidence/checkout-sha.txt"
          rc=0
          python3 build/r800_gps_acceptance.py --out "$evidence/report" || rc=$?
          if [ -f "$evidence/report/report.json" ]; then
            cat "$evidence/report/report.json"
          fi
          if [ "$rc" -ne 0 ]; then
            for log in "$evidence/report/"*.log; do
              [ ! -f "$log" ] || { printf '\n=== %s ===\n' "$log"; cat "$log"; }
            done
            exit "$rc"
          fi

      - name: Revalidate saved host evidence against exact checkout
        if: steps.acceptance.outcome == 'success'
        run: |
          set -eu
          evidence="$RUNNER_TEMP/r800-gnss-evidence"
          test "$(cat "$evidence/checkout-sha.txt")" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 build/r800_gps_verify_report.py "$evidence/report" --mode host --check-sources > "$evidence/verification.json"
          cat "$evidence/verification.json"
          echo "QEMU_EXECUTED=false"
          echo "safe_to_flash=false"

      - name: Preserve GNSS evidence (including failed acceptance)
        if: always() && steps.acceptance.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: r800-gnss-host-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/r800-gnss-evidence/
          if-no-files-found: error
          retention-days: 14
