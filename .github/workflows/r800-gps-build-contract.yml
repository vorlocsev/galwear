name: R800 GPS builder contract (NON-RELEASE)

on:
  push:
    branches:
      - development/r800-gps-glibc-closure-20261125
    paths:
      - .github/workflows/r800-gps-build-contract.yml
      - src/tools/gps/build.sh
      - tests/test_r800_gps_build.py
      - build/r800_gps_link_gate.py
      - build/r800_gps_glibc_qemu.sh
      - build/r800_gps_probe_tls_object.sh
      - build/r800_gps_probe_linked.py
      - tests/r800_probe_linked_regressions.py
      - build/r800_gps_qemu_evidence.py
      - tests/test_r800_gps_qemu_evidence.py
      - tests/r800_glibc_probe.c
      - tests/r800_glibc_probe_plugin.c
      - build/r800_gps_donor_snapshot.py
      - build/r800_gps_publish.py
      - build/r800_gps_provenance.py
      - build/r800_gps_host_elf.py
      - build/r800_gps_host_snapshot.py
      - build/r800_gps_host_trace.py
      - tests/test_r800_gps_host_trace.py
      - tests/test_r800_gps_host_snapshot.py
      - tests/test_r800_gps_host_elf.py
      - build/r800_gps_repeatability.py
      - build/r800_gps_xtra_matrix.py
      - build/r800_gps_export_audit.py
      - build/r800_gps_xtra_disasm.py
      - build/r800_gps_xtra_cfg.py
      - build/r800_gps_xtra_dataflow.py
      - build/r800_gps_xtra_calls.py
      - build/r800_gps_xtra_nested_calls.py
      - build/r800_gps_interface_table.py
      - build/r800_gps_interface_xref.py
      - build/r800_gps_pic_flow.py
      - tests/test_r800_gps_pic_flow.py
      - build/r800_gps_factory_xref.py
      - tests/test_r800_gps_factory_xref.py
      - tests/test_r800_gps_interface_xref.py
      - tests/test_r800_gps_interface_table.py
      - tests/test_r800_gps_xtra_nested_calls.py
      - tests/test_r800_gps_xtra_calls.py
      - tests/test_r800_gps_xtra_dataflow.py
      - tests/test_r800_gps_xtra_cfg.py
      - tests/test_r800_gps_xtra_disasm.py
      - tests/test_r800_gps_export_audit.py
      - tests/test_r800_gps_xtra_matrix.py
      - build/r800_android_linker_audit.py
      - build/r800_tizen_dependencies.py
      - build/r800_stage_tizen.py
      - build/r800_tizen_gnss_preflight.py
      - build/r800_verify_tizen_stage.py
      - build/r800_gps_static_readiness.py
      - tests/test_r800_gps_static_readiness.py
      - build/r800_pack_tizen_stage.py
      - tests/test_r800_tizen_dependencies.py
      - tests/test_r800_tizen_gnss_preflight.py
      - tests/test_r800_verify_tizen_stage.py
      - tests/test_r800_pack_tizen_stage.py
      - tests/test_android_linker_audit.py
      - src/tools/gps/gpsbridge.c
      - src/tools/gps/gps_abi.h
      - src/tools/gps/gps_command.h
      - src/tools/gps/gps_frame.h
      - src/tools/gps/gps_lto.h
      - src/tools/gps/gps_output.h
      - build/r800_android_userspace_preflight.py
      - tests/test_android_userspace_preflight.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Record exact checkout and scope
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git log -1 --format='%H'
          git hash-object build/r800_gps_pic_flow.py tests/test_r800_gps_pic_flow.py build/r800_gps_factory_xref.py tests/test_r800_gps_factory_xref.py build/r800_gps_interface_xref.py tests/test_r800_gps_interface_xref.py build/r800_gps_interface_table.py tests/test_r800_gps_interface_table.py build/r800_gps_xtra_nested_calls.py tests/test_r800_gps_xtra_nested_calls.py build/r800_gps_xtra_calls.py tests/test_r800_gps_xtra_calls.py build/r800_gps_xtra_dataflow.py tests/test_r800_gps_xtra_dataflow.py build/r800_gps_xtra_cfg.py tests/test_r800_gps_xtra_cfg.py build/r800_gps_xtra_disasm.py tests/test_r800_gps_xtra_disasm.py build/r800_gps_export_audit.py tests/test_r800_gps_export_audit.py build/r800_gps_xtra_matrix.py tests/test_r800_gps_xtra_matrix.py build/r800_gps_repeatability.py build/r800_gps_provenance.py build/r800_gps_publish.py build/r800_gps_donor_snapshot.py src/tools/gps/build.sh tests/test_r800_gps_build.py build/r800_android_userspace_preflight.py tests/test_android_userspace_preflight.py
          echo "HOST-ONLY synthetic contract; safe_to_flash=false"
      - name: Shell and Python syntax
        run: |
          sh -n src/tools/gps/build.sh
          python3 -m py_compile build/r800_gps_pic_flow.py tests/test_r800_gps_pic_flow.py build/r800_gps_factory_xref.py tests/test_r800_gps_factory_xref.py build/r800_gps_interface_xref.py tests/test_r800_gps_interface_xref.py build/r800_gps_interface_table.py tests/test_r800_gps_interface_table.py build/r800_gps_xtra_nested_calls.py tests/test_r800_gps_xtra_nested_calls.py build/r800_gps_xtra_calls.py tests/test_r800_gps_xtra_calls.py build/r800_gps_xtra_dataflow.py tests/test_r800_gps_xtra_dataflow.py build/r800_gps_xtra_cfg.py tests/test_r800_gps_xtra_cfg.py build/r800_gps_xtra_disasm.py tests/test_r800_gps_xtra_disasm.py build/r800_gps_export_audit.py tests/test_r800_gps_export_audit.py build/r800_gps_xtra_matrix.py tests/test_r800_gps_xtra_matrix.py build/r800_gps_repeatability.py build/r800_gps_provenance.py build/r800_gps_publish.py build/r800_gps_donor_snapshot.py tests/test_r800_gps_build.py build/r800_android_userspace_preflight.py tests/test_android_userspace_preflight.py
      - name: ARM32 glibc probe compile-only smoke
        run: |
          set -eu
          export LC_ALL=C
          sh -n build/r800_gps_glibc_qemu.sh
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          clang --version
          for source in tests/r800_glibc_probe.c tests/r800_glibc_probe_plugin.c; do
            output="$tmp/$(basename "$source").o"
            clang --target=armv7a-linux-gnueabi -mfloat-abi=softfp -mfpu=vfpv3-d16 -O2 --no-default-config -nostdinc -ffreestanding -fno-builtin -fno-stack-protector -Wall -Wextra -Werror -c "$source" -o "$output"
            readelf -h "$output" > "$output.header"
            grep -Eq 'Class:[[:space:]]*ELF32' "$output.header"
            grep -Eq 'Data:.*little endian' "$output.header"
            grep -Eq 'Type:[[:space:]]*REL' "$output.header"
            grep -Eq 'Machine:[[:space:]]*ARM[[:space:]]*$' "$output.header"
            grep -Eq 'Flags:.*Version5 EABI' "$output.header"
          done
          # Explicit positive/negative TLS ABI checks. Neither object is run.
          clang --target=armv7a-linux-gnueabi -marm -mfloat-abi=softfp -mfpu=vfpv3-d16 -mtp=cp15 -ftls-model=local-exec -O2 --no-default-config -nostdinc -ffreestanding -fno-builtin -fno-stack-protector -fno-pic -fno-pie -Wall -Wextra -Werror -c tests/r800_glibc_probe.c -o "$tmp/tls-cp15.o"
          sh build/r800_gps_probe_tls_object.sh readelf "$tmp/tls-cp15.o"
          clang --target=armv7a-linux-gnueabi -marm -mfloat-abi=softfp -mfpu=vfpv3-d16 -mtp=soft -ftls-model=local-exec -O2 --no-default-config -nostdinc -ffreestanding -fno-builtin -fno-stack-protector -fno-pic -fno-pie -Wall -Wextra -Werror -c tests/r800_glibc_probe.c -o "$tmp/tls-soft.o"
          if sh build/r800_gps_probe_tls_object.sh readelf "$tmp/tls-soft.o"; then
            echo "Unexpected acceptance of software thread-pointer helper" >&2
            exit 1
          fi
          # Synthetic link-only providers: every function traps if executed.
          for spec in 'libc.so.6 __libc_start_main puts fflush gnu_get_libc_version strcmp' 'libdl.so.2 dlopen dlsym dlclose' 'libpthread.so.0 pthread_create pthread_join'; do
            set -- $spec
            name=$1
            shift
            : > "$tmp/$name.c"
            for sym in "$@"; do
              printf '%s\n' "__attribute__((noreturn)) void $sym(void) { __asm__ volatile(\"udf #0\"); __builtin_unreachable(); }" >> "$tmp/$name.c"
            done
            printf 'GLIBC_2.4 { global: %s; local: *; };\n' "$(printf '%s; ' "$@" | sed 's/; $//')" > "$tmp/$name.map"
            clang --target=armv7a-linux-gnueabi -marm -mfloat-abi=softfp -mfpu=vfpv3-d16 -nostdlib -ffreestanding -fno-builtin -fPIC -shared -fuse-ld=lld -Wl,--hash-style=sysv,-soname,"$name",--version-script="$tmp/$name.map" -o "$tmp/$name" "$tmp/$name.c"
          done
          clang --target=armv7a-linux-gnueabi -marm -mfloat-abi=softfp -mfpu=vfpv3-d16 --no-default-config -nostdlib -no-pie -fuse-ld=lld -Wl,--hash-style=sysv,-z,noexecstack,-z,now,--no-undefined -Wl,--dynamic-linker=/lib/ld-linux.so.3,-e,_start -o "$tmp/probe" "$tmp/tls-cp15.o" "$tmp/libc.so.6" "$tmp/libdl.so.2" "$tmp/libpthread.so.0"
          python3 build/r800_gps_probe_linked.py "$tmp/probe"
          python3 tests/r800_probe_linked_regressions.py "$tmp/probe" -v
          echo "ARM32_SYNTHETIC_LINK_ONLY=PASS"
          echo "ARM32_PROBE_COMPILE_ONLY=PASS"
          echo "QEMU_EXECUTED=false"
          echo "safe_to_flash=false"

      - name: Synthetic builder regression tests
        run: python3 -m unittest discover -s tests -p test_r800_gps_build.py -v

      - name: Bounded donor reads and userspace structure regressions
        run: python3 -m unittest discover -s tests -p test_android_userspace_preflight.py -v

      - name: XTRA ABI matrix orchestration regressions
        run: python3 -m unittest discover -s tests -p test_r800_gps_xtra_matrix.py -v

      - name: GPS export classification regressions
        run: python3 -m unittest discover -s tests -p test_r800_gps_export_audit.py -v

      - name: ARM Thumb XTRA lexical evidence regressions
        run: python3 -m unittest discover -s tests -p test_r800_gps_xtra_disasm.py -v

      - name: ARM Thumb XTRA CFG regressions
        run: python3 -m unittest discover -s tests -p test_r800_gps_xtra_cfg.py -v

      - name: ARM Thumb XTRA dataflow regressions
        run: python3 -m unittest discover -s tests -p test_r800_gps_xtra_dataflow.py -v

      - name: ARM Thumb XTRA assumed AAPCS call regressions
        run: python3 -m unittest discover -s tests -p test_r800_gps_xtra_calls.py -v

      - name: ARM Thumb XTRA nested call regressions
        run: python3 -m unittest discover -s tests -p test_r800_gps_xtra_nested_calls.py -v

      - name: GPS HAL interface table ELF32 regressions
        run: python3 -m unittest discover -s tests -p test_r800_gps_interface_table.py -v

      - name: GPS HAL interface cross-reference regressions
        run: python3 -m unittest discover -s tests -p test_r800_gps_interface_xref.py -v

      - name: GPS factory dynamic symbol range regressions
        run: python3 -m unittest discover -s tests -p test_r800_gps_factory_xref.py -v

      - name: A32 PIC forward dataflow regressions
        run: python3 -m unittest discover -s tests -p test_r800_gps_pic_flow.py -v

      - name: Tizen ELF dependency, staging and archive contract
        run: |
          python3 -m py_compile build/r800_tizen_dependencies.py build/r800_tizen_gnss_preflight.py build/r800_stage_tizen.py build/r800_verify_tizen_stage.py build/r800_pack_tizen_stage.py
          for suite in test_r800_tizen_dependencies.py test_r800_tizen_gnss_preflight.py test_r800_verify_tizen_stage.py test_r800_pack_tizen_stage.py; do
            python3 -m unittest discover -s tests -p "$suite" -v || exit 1
          done

      - name: Static GPS readiness evidence contract
        run: |
          python3 -m py_compile build/r800_gps_static_readiness.py
          python3 -m unittest discover -s tests -p test_r800_gps_static_readiness.py -v

      - name: Static x86-64 host tool dependency inventory
        run: |
          python3 -m py_compile build/r800_gps_host_elf.py
          python3 -m unittest discover -s tests -p test_r800_gps_host_elf.py -v

      - name: Captured host loader and library snapshot contract
        run: |
          python3 -m py_compile build/r800_gps_host_snapshot.py
          python3 -m unittest discover -s tests -p test_r800_gps_host_snapshot.py -v

      - name: Runtime host loader diagnostic contract
        run: |
          python3 -m py_compile build/r800_gps_host_trace.py
          python3 -m unittest discover -s tests -p test_r800_gps_host_trace.py -v

      - name: QEMU glibc probe evidence regressions (no guest execution)
        run: |
          python3 -m py_compile build/r800_gps_qemu_evidence.py
          python3 -m unittest discover -s tests -p test_r800_gps_qemu_evidence.py -v
