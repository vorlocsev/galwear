name: SM-R800 NetOdin offline protocol simulation

on:
  push:
    branches:
      - "hardening/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulated-odin-protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Python source syntax
        run: python3 -m py_compile installer/netodin.py installer/r800_safety.py tests/test_netodin_protocol.py
      - name: Simulated PIT retrieval and transfer failures
        run: python3 -m unittest discover -s tests -p 'test_netodin_protocol.py' -v
      - name: Existing firmware and recovery regressions
        run: |
          python3 -m unittest discover -s tests -p 'test_installer_guard.py' -v
          python3 -m unittest discover -s tests -p 'test_recovery_audit.py' -v
