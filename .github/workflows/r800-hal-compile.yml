name: SM-R800 legacy Android HAL compile (non-release)

on:
  push:
    branches:
      - "development/r800-android-linker-audit-20261125"
    paths:
      - ".github/workflows/r800-hal-compile.yml"
      - "build/r800_build_hals.sh"
      - "build/r800_tinyalsa_sync_test.py"
      - "build/r800_stage_hals.py"
      - "build/r800_vendor_inputs.py"
      - "src/vendor/**"
      - "src/vendor/audio/tinyalsa-2.0.0-sync-ptr.patch"
      - "src/hal/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arm32-hal-compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Android NDK r27c
        run: |
          set -eu
          archive="$RUNNER_TEMP/android-ndk-r27c-linux.zip"
          curl --fail --location --retry 3 --connect-timeout 30 --max-time 600 \
            https://dl.google.com/android/repository/android-ndk-r27c-linux.zip -o "$archive"
          # Official Android NDK r27c Linux release checksum (SHA-1).
          printf '%s  %s\n' 090e8083a715fdb1a3e402d0763c388abb03fb4e "$archive" | sha1sum -c -
          unzip -q "$archive" -d "$RUNNER_TEMP"
          test -x "$RUNNER_TEMP/android-ndk-r27c/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi28-clang"
      - name: Compile Android API 28 ARM32 HALs
        run: |
          sh -n build/r800_build_hals.sh
          sh build/r800_build_hals.sh "$RUNNER_TEMP/android-ndk-r27c" "$RUNNER_TEMP/r800-hal"
      - name: Simulate PCM sync pointer ownership (no ALSA device)
        run: python3 build/r800_tinyalsa_sync_test.py --source "$RUNNER_TEMP/r800-hal/tinyalsa/src/pcm.c"
      - name: Stage matching vendor and payload HAL bytes (no mounts)
        run: |
          python3 build/r800_stage_hals.py --hal-dir "$RUNNER_TEMP/r800-hal" \
            --vendor-sources src/vendor --output "$RUNNER_TEMP/r800-stage"
          for module in audio.primary.r800.so gps.r800.so hwcomposer.r800.so sensors.r800.so; do
            cmp "$RUNNER_TEMP/r800-stage/vendor-overlay/$module" "$RUNNER_TEMP/r800-stage/payload/hwc/$module"
          done
      - name: Compile Broadcom Bluetooth vendor library for BCM43012
        run: |
          sh -n src/vendor/libbt/build.sh
          sh src/vendor/libbt/build.sh "$RUNNER_TEMP/android-ndk-r27c" "$RUNNER_TEMP/r800-bt"
      - name: Upload compiler and ELF evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r800-hal-evidence-only
          path: |
            ${{ runner.temp }}/r800-hal/*.elf.txt
            ${{ runner.temp }}/r800-hal/toolchain.txt
            ${{ runner.temp }}/r800-hal/tinyalsa-evidence.txt
            ${{ runner.temp }}/r800-stage/hal-stage-evidence.json
            ${{ runner.temp }}/r800-bt/libbt-vendor.elf.txt
            ${{ runner.temp }}/r800-bt/bt-build-evidence.txt
          if-no-files-found: warn
          retention-days: 7
