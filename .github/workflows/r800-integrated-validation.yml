name: SM-R800 integrated offline validation

on:
  push:
    branches:
      - "development/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  all-offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax validation
        run: python3 -m compileall -q installer tests
      - name: Power helper syntax
        run: sh -n payload/android-helper.sh
      - name: Install required DTB regression tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends device-tree-compiler
          command -v dtc
          command -v fdtget
      - name: Complete synthetic test suite (no device, no external firmware)
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Ensure root has not been touched
        run: |
          test "$(git rev-parse --abbrev-ref HEAD)" != "main"
          git status --porcelain
